/* ============================================================================
   9. 指针交互
   ========================================================================== */
let dragging = false;
let lastX = 0, lastY = 0;
let dragDist = 0;
let downTime = 0;
let pointerX = 0, pointerY = 0;

const raycaster = new THREE.Raycaster();
const pointerNDC = new THREE.Vector2(-10, -10);
let hoveredCard = null;

function setNDC(clientX, clientY) {
  pointerNDC.x = (clientX / window.innerWidth) * 2 - 1;
  pointerNDC.y = -(clientY / window.innerHeight) * 2 + 1;
}

function pickPhoto(clientX, clientY) {
  if (!photosActive) return null;
  setNDC(clientX, clientY);
  raycaster.setFromCamera(pointerNDC, camera);
  const hits = raycaster.intersectObjects(photoGroup.children, false);
  return hits.length ? hits[0].object.userData.card : null;
}

canvas.addEventListener('pointerdown', e => {
  dragging = true;
  dragDist = 0;
  downTime = performance.now();
  lastX = e.clientX;
  lastY = e.clientY;
  pointerX = e.clientX;
  pointerY = e.clientY;
  canvas.classList.add('dragging');
  try { canvas.setPointerCapture?.(e.pointerId); } catch (_) {}
});

canvas.addEventListener('pointermove', e => {
  pointerX = e.clientX;
  pointerY = e.clientY;
  setNDC(e.clientX, e.clientY);
  if (!dragging) return;
  const dx = e.clientX - lastX;
  const dy = e.clientY - lastY;
  lastX = e.clientX;
  lastY = e.clientY;
  dragDist += Math.abs(dx) + Math.abs(dy);

  state.viewYawTarget -= dx * 0.0058;
  state.viewPitchTarget = clamp(state.viewPitchTarget + dy * 0.0045, -0.28, 1.12);
});

const _v3 = new THREE.Vector3();
function nearCandle(e) {
  _v3.set(0, FLAME_BASE + 0.22, 0).project(camera);
  const sx = (_v3.x * 0.5 + 0.5) * window.innerWidth;
  const sy = (-_v3.y * 0.5 + 0.5) * window.innerHeight;
  return Math.hypot(e.clientX - sx, e.clientY - sy) < 140;
}

function endDrag(e) {
  if (!dragging) return;
  dragging = false;
  canvas.classList.remove('dragging');
  try { canvas.releasePointerCapture?.(e?.pointerId); } catch (_) {}

  if (dragDist < 8 && performance.now() - downTime < 450) {
    const card = e ? pickPhoto(e.clientX, e.clientY) : null;
    if (card) { openViewer(card.index); return; }

    if (ritual.stage === 'unlit' && e && nearCandle(e)) { igniteCandle('点击蜡烛'); return; }
    if (ritual.stage === 'ready' && e && nearCandle(e)) { blowOut('点击蜡烛'); return; }

    state.spreadTarget = state.spreadTarget > 0.5 ? 0 : 1;
  }
}
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  state.distTarget = clamp(state.distTarget * (1 + Math.sign(e.deltaY) * 0.085), 3.4, 9.6);
}, { passive: false });

$('btn-scatter').addEventListener('click', () => { state.spreadTarget = 1; });
$('btn-gather').addEventListener('click', () => {
  if (ritual.stage === 'posed') return;
  state.spreadTarget = 0;
});
$('btn-reset').addEventListener('click', () => {
  state.viewYawTarget = 0;
  state.viewPitchTarget = 0.18;
  state.distTarget = 6.4;
  state.handSpinTarget = 0;
  state.flameTarget = 1;
  gesture.openness = 0;
  gesture.pinch = 0;
});

/* ============================================================================
   10. MediaPipe Hands
   ========================================================================== */
let hands = null;
let stream = null;
let cameraOn = false;
let mpBusy = false;
let lastSend = 0;

const HAND_CONNECTIONS = [
  [0, 1], [1, 2], [2, 3], [3, 4],
  [0, 5], [5, 6], [6, 7], [7, 8],
  [5, 9], [9, 10], [10, 11], [11, 12],
  [9, 13], [13, 14], [14, 15], [15, 16],
  [13, 17], [17, 18], [18, 19], [19, 20],
  [0, 17]
];

function setCamUI(on) {
  btnCam.textContent = on ? '关闭摄像头' : '开启摄像头';
  btnCam.classList.toggle('on', on);
  dotEl.className = 'dot' + (on ? ' live' : '');
  camPlaceholder.style.display = on ? 'none' : 'flex';
  hintEl.textContent = on
    ? '☝🏻 变花束 · ✌🏻 散星空 · 👍🏻 回蛋糕 · 🙏🏻 许愿'
    : '拖拽旋转 · 滚轮缩放 · 点击画面切换扩散 / 聚拢';
}

async function waitForHands(timeout = 12000) {
  const t0 = performance.now();
  while (typeof window.Hands !== 'function' && performance.now() - t0 < timeout) {
    await new Promise(r => setTimeout(r, 120));
  }
  return typeof window.Hands === 'function';
}

async function startCamera() {
  if (cameraOn) return;
  btnCam.disabled = true;
  setStatus('正在启动摄像头…');
  dotEl.className = 'dot wait';

  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      throw new Error('浏览器不支持摄像头');
    }
    stream = await navigator.mediaDevices.getUserMedia({
      video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: 'user' },
      audio: false
    });
    videoEl.srcObject = stream;
    await videoEl.play();

    if (!(await waitForHands())) throw new Error('手势识别库未加载');

    if (!hands) {
      hands = new window.Hands({
        locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${f}`
      });
      hands.setOptions({
        maxNumHands: 1,          // 许愿改为纯点击，恢复单只手以省性能、防误触
        modelComplexity: 0,
        minDetectionConfidence: 0.6,
        minTrackingConfidence: 0.55,
        selfieMode: false
      });
      hands.onResults(onHandResults);
    }

    cameraOn = true;
    setCamUI(true);
    setStatus('摄像头已开启 · 请把手放进画面', true);
    pump();
  } catch (err) {
    console.warn('[camera]', err);
    const msg = err && err.message ? err.message : String(err);
    setStatus('摄像头不可用：' + msg + ' · 已切换到鼠标模式');
    dotEl.className = 'dot';
    stopCamera(true);
  } finally {
    btnCam.disabled = false;
  }
}

function stopCamera(silent = false) {
  cameraOn = false;
  if (stream) {
    stream.getTracks().forEach(t => t.stop());
    stream = null;
  }
  try { videoEl.srcObject = null; } catch (_) {}
  overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
  gesture.active = false;
  gesture.openness = 0;
  gesture.pinch = 0;
  setCamUI(false);
  dotEl.className = 'dot';
  if (!silent) setStatus('摄像头已关闭 · 鼠标模式可用');
}

async function pump() {
  if (!cameraOn) return;
  const now = performance.now();
  if (!mpBusy && now - lastSend > 55 && videoEl.readyState >= 2) {
    lastSend = now;
    mpBusy = true;
    try {
      await hands.send({ image: videoEl });
    } catch (e) { /* ignore single frame */ }
    mpBusy = false;
  }
  if (cameraOn) requestAnimationFrame(pump);
}

btnCam.addEventListener('click', () => {
  if (cameraOn) stopCamera();
  else startCamera();
});

function onHandResults(results) {
  drawOverlay(results);

  const list = results.multiHandLandmarks || [];
  gesture.handCount = list.length;

  if (list.length === 0) {
    gesture.active = false;
    gesture.oneFinger = false;
    // 手离开画面：保持量缓缓衰减（容忍 MediaPipe 偶发丢帧），而不是立刻清零
    ritual.holdPinch *= 0.92;
    ritual.holdPeace *= 0.92;
    ritual.holdThumb *= 0.92;
    ritual.holdFinger *= 0.92;
    if (performance.now() - gesture.lastSeen > 800) {
      setStatus('未检测到手 · 可继续用鼠标操作');
      barOpen.style.width = (state.spread * 100) + '%';
      barPinch.style.width = '0%';
    }
    return;
  }

  gesture.active = true;
  gesture.lastSeen = performance.now();
  analyzeHand(list[0]);
}

let lastHandTime = 0;
const pct = v => Math.round(clamp01(v) * 100);

function analyzeHand(lm) {
  const d = (i, j) => Math.hypot(
    lm[i].x - lm[j].x,
    lm[i].y - lm[j].y,
    (lm[i].z - lm[j].z) * 0.6
  );

  const palm = Math.max(0.02, d(0, 9));

  const indexExt = d(8, 0) > d(6, 0) * 1.12;
  const middleExt = d(12, 0) > d(10, 0) * 1.12;
  const ringExt = d(16, 0) > d(14, 0) * 1.12;
  const pinkyExt = d(20, 0) > d(18, 0) * 1.12;

  let ext = 0;
  if (indexExt) ext++;
  if (middleExt) ext++;
  if (ringExt) ext++;
  if (pinkyExt) ext++;
  const thumbExt = d(4, 17) / palm > 1.08;

  const opennessRaw = clamp01((ext + (thumbExt ? 1 : 0)) / 5);
  const pinchRaw = clamp01((0.62 - d(4, 8) / palm) / 0.42);

  // ☝🏻 比 1：仅食指伸直，中/无名/小指明确收拢（拇指自然收拢，不作要求）
  const oneFinger = indexExt && !middleExt && !ringExt && !pinkyExt;

  // ✌🏻：食指 + 中指伸直，无名指 + 小指收拢
  const peace = indexExt && middleExt && !ringExt && !pinkyExt;

  // 👍🏻：拇指向上伸展（指尖明显高于拇指根部），其余四指全部收拢
  const noFingers = !indexExt && !middleExt && !ringExt && !pinkyExt;
  const thumbUp = thumbExt &&
    lm[4].y < lm[2].y - 0.02 &&                       // 指尖高于拇指根部
    Math.abs(lm[4].x - lm[2].x) < 0.20 &&             // 竖直而非横伸
    d(4, 0) / palm > 1.05;
  const thumbsUp = noFingers && thumbUp;

  gesture.peace = peace;
  gesture.thumbsUp = thumbsUp;
  gesture.oneFinger = oneFinger;

  gesture.openness = damp(gesture.openness, opennessRaw, 9, 1 / 30);
  gesture.pinch = damp(gesture.pinch, pinchRaw, 9, 1 / 30);

  // 照片星环阶段锁定最大分散；花束变形期间不插手，让形态干净地过渡
  const shapeStages = ritual.stage === 'lit' || ritual.stage === 'bouquet' || ritual.stage === 'posed';
  if (gesture.pinch < 0.6 && !shapeStages) {
    state.spreadTarget = clamp01((gesture.openness - 0.32) / 0.56);
  }

  const cx = (lm[0].x + lm[5].x + lm[9].x + lm[13].x + lm[17].x) / 5;
  const cy = (lm[0].y + lm[5].y + lm[9].y + lm[13].y + lm[17].y) / 5;
  const mx = 1 - cx;
  state.handSpinTarget = (mx - 0.5) * Math.PI * 1.4;
  state.viewPitchTarget = clamp(0.18 + (cy - 0.45) * 1.1, -0.25, 1.05);

  if (ritual.stage !== 'posed' && ritual.stage !== 'bouquet') {
    state.distTarget = clamp(6.4 - gesture.pinch * 2.0, 3.6, 9.6);
  }
  state.flameTarget = 1.0 + gesture.pinch * 0.85;

  const nowH = performance.now();
  const hdt = lastHandTime ? clamp((nowH - lastHandTime) / 1000, 0.01, 0.25) : 1 / 30;
  lastHandTime = nowH;
  updateRitualGestures(hdt);

  // 状态文案：每个手势的保持进度都要有反馈；吹蜡烛/许愿倒计时阶段不覆盖状态栏
  if (ritual.stage !== 'ready' && ritual.stage !== 'wishing' && ritual.stage !== 'blown') {
    let label;
    if (ritual.stage === 'lit' && oneFinger) {
      label = `检测到：比 1 ☝🏻 · 保持 ${pct(ritual.holdFinger / FINGER_HOLD)}% 变花束`;
    } else if (ritual.stage === 'bouquet' && peace) {
      label = `检测到：比耶 ✌🏻 · 保持 ${pct(ritual.holdPeace / PEACE_HOLD)}% 展开照片`;
    } else if (ritual.stage === 'posed' && thumbsUp) {
      label = `检测到：点赞 👍🏻 · 保持 ${pct(ritual.holdThumb / THUMB_HOLD)}% 回蛋糕`;
    } else if (ritual.stage === 'posed') {
      label = '照片环绕中 · 比个赞 👍🏻 回到蛋糕';
    } else if (ritual.stage === 'bouquet') {
      label = '花束已成型 🌷 · 比个耶 ✌🏻 散成星空';
    } else if (ritual.stage === 'lit') {
      label = '比个 1 ☝🏻 变出花束';
    } else if (ritual.stage === 'gathered') {
      label = '闭上眼睛，默念你的心愿 · 点下方按钮许愿';
    } else if (gesture.pinch > 0.62) {
      label = `检测到：捏合 · 拉近 ${Math.round(gesture.pinch * 100)}%`;
    } else if (gesture.openness > 0.74) {
      label = `检测到：张开手掌 · 扩散 ${Math.round(state.spreadTarget * 100)}%`;
    } else if (gesture.openness < 0.3) {
      label = '检测到：握拳 · 聚拢';
    } else {
      label = `检测到：半握 · 过渡 ${Math.round(state.spreadTarget * 100)}%`;
    }
    gesture.label = label;
    setStatus(label, true);
  }

  barOpen.style.width = (gesture.openness * 100) + '%';
  barPinch.style.width = (gesture.pinch * 100) + '%';
}

function updateRitualGestures(dt) {
  if (ritual.leaving) return;

  // ① 捏合保持 0.8 秒 → 点燃
  if (ritual.stage === 'unlit') {
    ritual.holdPinch = gesture.pinch > 0.7 ? ritual.holdPinch + dt : 0;
    if (ritual.holdPinch >= 0.8) {
      ritual.holdPinch = 0;
      igniteCandle('捏合手势');
    }
  }

  // ② 比 1（只伸食指）保持 0.7 秒 → 变成花束
  if (ritual.stage === 'lit') {
    ritual.holdFinger = gesture.oneFinger ? ritual.holdFinger + dt : 0;
    if (ritual.holdFinger >= FINGER_HOLD) {
      ritual.holdFinger = 0;
      bouquetMorph('比 1 手势');
    }
  }

  // ③ 比耶保持 0.7 秒 → 花束散成星空 + 照片
  if (ritual.stage === 'bouquet') {
    ritual.holdPeace = gesture.peace ? ritual.holdPeace + dt : 0;
    if (ritual.holdPeace >= PEACE_HOLD) {
      ritual.holdPeace = 0;
      posePhotos('比耶手势');
    }
  }

  // ④ 点赞保持 0.7 秒 → 聚拢回蛋糕
  if (ritual.stage === 'posed') {
    ritual.holdThumb = gesture.thumbsUp ? ritual.holdThumb + dt : 0;
    if (ritual.holdThumb >= THUMB_HOLD) {
      ritual.holdThumb = 0;
      gatherBack('点赞手势');
    }
  }

  // ⑤ 许愿改为纯点击交互，这里不再做手势识别
}

function drawOverlay(results) {
  const w = overlayCanvas.width;
  const h = overlayCanvas.height;
  overlayCtx.clearRect(0, 0, w, h);

  const list = results.multiHandLandmarks;
  if (!list) return;

  for (const lm of list) {
    const pts = lm.map(p => ({ x: p.x * w, y: p.y * h }));

    overlayCtx.strokeStyle = 'rgba(255,205,140,0.85)';
    overlayCtx.lineWidth = 2;
    overlayCtx.beginPath();
    for (const [a, b] of HAND_CONNECTIONS) {
      overlayCtx.moveTo(pts[a].x, pts[a].y);
      overlayCtx.lineTo(pts[b].x, pts[b].y);
    }
    overlayCtx.stroke();

    overlayCtx.fillStyle = '#ffe9c2';
    for (const p of pts) {
      overlayCtx.beginPath();
      overlayCtx.arc(p.x, p.y, 2.4, 0, Math.PI * 2);
      overlayCtx.fill();
    }
  }
}

/* ============================================================================
   11. 麦克风吹气检测（带底噪校准）
   ========================================================================== */
/* 麦克风状态。旧版要求「低频占比 > 42%」，但绝大多数笔记本/手机麦克风带高通滤波，
   吹气的能量很宽、低频占比常常到不了 42% → 永远返回 0（本次"吹了没反应"的主因）。
   新版判据：自适应底噪门限 + 频谱平坦度（吹气是宽带噪声，频谱平；说话有谐波/共振峰，频谱尖）
   + 可调灵敏度 + 实时电平条（能立刻看到麦克风到底有没有收到声音）。 */
const MIC = {
  sens: 0.7,        // 灵敏度 0..1（面板滑块）
  baseline: 0.012,  // 环境底噪，自适应
  rms: 0,
  level: 0,         // 显示用电平 0..1
  flatness: 0,
  lowRatio: 0,
  cv: 0,            // 包络起伏（变异系数）
  hist: [],         // 最近若干帧 rms
  silent: 0         // 连续"数字静音"帧数，用于诊断
};

let micStream = null;
let audioCtx = null;
let analyser = null;
let micOn = false;
let micTimeData = null;
let micFreqData = null;
let micLastResume = 0;

async function enableMic() {
  if (micOn) return true;
  try {
    if (!navigator.mediaDevices?.getUserMedia) throw new Error('浏览器不支持麦克风');

    // 先尝试关掉浏览器自带的降噪/AGC（它们会吃掉吹气的能量），失败再退回默认
    try {
      micStream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
      });
    } catch (_) {
      micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    }

    const AC = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AC();
    const src = audioCtx.createMediaStreamSource(micStream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 1024;
    analyser.smoothingTimeConstant = 0.4;
    src.connect(analyser);
    micTimeData = new Float32Array(analyser.fftSize);
    micFreqData = new Uint8Array(analyser.frequencyBinCount);

    micOn = true;
    MIC.baseline = 0.012;
    MIC.silent = 0;
    MIC.rms = 0;
    MIC.level = 0;
    MIC.hist.length = 0;

    // 浏览器自动播放策略下 AudioContext 可能是 suspended，此时拿到的数据全是 0
    if (audioCtx.state !== 'running') {
      try { await audioCtx.resume(); } catch (_) {}
    }
    setStatus(audioCtx.state === 'running'
      ? '麦克风已开启 · 对着蛋糕吹气'
      : '麦克风已就绪 · 音频被浏览器挂起，点一下页面任意处启用', true);
    return true;
  } catch (err) {
    micOn = false;
    setStatus('麦克风不可用：' + (err?.message || err) + ' · 请用按钮吹灭');
    return false;
  } finally {
    if (ritual.stage === 'ready' || ritual.stage === 'gathered') syncRitualUI();
  }
}

function stopMic() {
  if (micStream) micStream.getTracks().forEach(t => t.stop());
  micStream = null;
  if (audioCtx) audioCtx.close().catch(() => {});
  audioCtx = null;
  analyser = null;
  micOn = false;
  ritual.blowScore = 0;
  ritual.air = 0;
  MIC.level = 0;
  MIC.rms = 0;
  MIC.hist.length = 0;
}

/** 纯函数：根据一帧数据判定吹气强度（独立出来便于离线验证）
 *  rms   : 时域能量
 *  freq  : 频谱字节数据（可传空数组跳过频谱项）
 *  cv    : 最近若干帧 rms 的变异系数——吹气稳定（小），说话有音节起伏（大）
 */
function classifyBlow(rms, freq, sens, baseline, cv) {
  // 频谱只看 0–4.5kHz：更高频段吹气几乎没有能量，会把"平坦度"算崩
  const N = Math.min(96, freq.length);
  let low = 0, total = 0, logSum = 0, linSum = 0;
  for (let i = 1; i < N; i++) {
    const p = freq[i] / 255;
    total += p;
    if (i < 16) low += p;                 // ≈0–690Hz
    logSum += Math.log(p + 0.002);
    linSum += p;
  }
  const cnt = Math.max(1, N - 1);
  const lowRatio = total > 0 ? low / total : 0;
  const flatness = N > 1 ? Math.exp(logSum / cnt) / (linSum / cnt + 1e-6) : 0;

  // 灵敏度映射：越高 → 门限越低、强度曲线越陡
  const s = sens;
  const gateMul = 2.6 - s * 1.2;       // 0.7 → 1.76
  const span = 0.10 - s * 0.05;        // 0.7 → 0.065
  const gate = Math.max(0.008, baseline * gateMul);
  const level = clamp01(Math.sqrt(rms / 0.16));

  if (rms < gate) return { blow: 0, level, flatness, lowRatio, gate, cv, steady: 0 };

  const strength = clamp01((rms - gate) / span);

  // 稳态度：吹气是持续的噪声气流，能量平稳；说话/大喊的包络起伏明显
  const steady = clamp01((0.62 - cv) / 0.34);   // cv 0.28 → 1.0 ；cv 0.62 → 0

  // 频谱平坦度只作为加分项：不同麦克风频响差异极大，不能当硬判据
  const noiseLike = clamp01((flatness - 0.30) / 0.35);

  return {
    blow: clamp01(strength * steady * (0.55 + 0.45 * noiseLike)),
    level, flatness, lowRatio, gate, cv, steady
  };
}

/** 读取一帧麦克风数据，返回吹气强度 0..1 */
function detectBlow() {
  if (!micOn || !analyser) return 0;

  // 被挂起的音频上下文不会产生数据，定期尝试恢复
  if (audioCtx && audioCtx.state !== 'running') {
    const now = performance.now();
    if (now - micLastResume > 1200) {
      micLastResume = now;
      audioCtx.resume().catch(() => {});
    }
    return 0;
  }

  analyser.getFloatTimeDomainData(micTimeData);
  let sum = 0;
  for (let i = 0; i < micTimeData.length; i++) sum += micTimeData[i] * micTimeData[i];
  const rms = Math.sqrt(sum / micTimeData.length);
  MIC.rms = rms;
  MIC.silent = rms < 1e-5 ? MIC.silent + 1 : 0;

  // 包络起伏：最近 16 帧（≈0.27 秒）的变异系数
  MIC.hist.push(rms);
  if (MIC.hist.length > 16) MIC.hist.shift();
  let cv = 0.2;
  if (MIC.hist.length >= 6) {
    const m = MIC.hist.reduce((a, b) => a + b, 0) / MIC.hist.length;
    if (m > 1e-4) {
      const v = MIC.hist.reduce((a, b) => a + (b - m) * (b - m), 0) / MIC.hist.length;
      cv = Math.sqrt(v) / m;
    } else {
      cv = 1;
    }
  }

  analyser.getByteFrequencyData(micFreqData);
  const res = classifyBlow(rms, micFreqData, MIC.sens, MIC.baseline, cv);

  MIC.lowRatio = res.lowRatio;
  MIC.flatness = res.flatness;
  MIC.level = res.level;
  MIC.cv = cv;

  // 底噪校准：安静时（含稳态环境噪声）慢速跟随，避免把吹气本身当成底噪
  if (rms < res.gate * 1.3) {
    MIC.baseline = clamp(MIC.baseline * 0.97 + rms * 0.03, 0.002, 0.06);
  }

  return res.blow;
}

/* ============================================================================
   12. 照片灯箱
   ========================================================================== */
let viewerIndex = -1;

function openViewer(index) {
  viewerIndex = (index + MEMORY_PHOTOS.length) % MEMORY_PHOTOS.length;
  const item = MEMORY_PHOTOS[viewerIndex];
  viewerCapText.textContent = item.caption || '';
  viewerCapIdx.textContent = `${viewerIndex + 1} / ${MEMORY_PHOTOS.length}`;

  const url = (item.url || '').trim();
  viewerImg.classList.remove('loaded');
  viewerSkel.classList.remove('hide');
  viewerFallback.style.display = 'none';

  if (url) {
    viewerImg.style.display = 'block';
    // 重新触发加载动画
    viewerImg.src = url;
    if (viewerImg.complete && viewerImg.naturalWidth) {
      viewerImg.classList.add('loaded');
      viewerSkel.classList.add('hide');
    }
  } else {
    viewerImg.style.display = 'none';
    viewerSkel.classList.add('hide');
    viewerFallback.style.display = 'grid';
  }
  viewerEl.classList.add('show');
}

viewerImg.addEventListener('load', () => {
  viewerImg.classList.add('loaded');
  viewerSkel.classList.add('hide');
});
viewerImg.addEventListener('error', () => {
  viewerImg.style.display = 'none';
  viewerSkel.classList.add('hide');
  viewerFallback.style.display = 'grid';
});

function closeViewer() {
  viewerEl.classList.remove('show');
  viewerIndex = -1;
}

function stepViewer(delta) {
  if (viewerIndex < 0) return;
  openViewer(viewerIndex + delta);
}

viewerEl.addEventListener('click', e => {
  const btn = e.target.closest('[data-v]');
  if (!btn) return;
  switch (btn.dataset.v) {
    case 'close': closeViewer(); break;
    case 'prev': stepViewer(-1); break;
    case 'next': stepViewer(1); break;
    case 'gather': closeViewer(); gatherBack('灯箱按钮'); break;
  }
});
viewerEl.addEventListener('click', e => {
  if (e.target === viewerEl) closeViewer();
});

document.addEventListener('keydown', e => {
  if (viewerIndex < 0) return;
  if (e.key === 'Escape') closeViewer();
  else if (e.key === 'ArrowLeft') stepViewer(-1);
  else if (e.key === 'ArrowRight') stepViewer(1);
});

/* ============================================================================
   13. 仪式状态机（点燃 → 比耶 → 点赞 → 吹灭）
   ========================================================================== */
const STEPS = ['点燃', '花束', '比耶', '点赞', '许愿', '吹灭'];

function stageIndex(s) {
  switch (s) {
    case 'unlit': return 0;
    case 'lit': return 1;
    case 'bouquet': return 2;
    case 'posed': return 3;
    case 'gathered': return 4;
    case 'wishing': return 4;
    case 'ready': return 5;
    default: return 6;          // blown：全部点亮
  }
}

/** ① 点燃蜡烛 */
function igniteCandle(source) {
  if (ritual.stage !== 'unlit' || ritual.leaving) return;
  ritual.stage = 'lit';
  ritual.t = 0;
  ritual.igniteTarget = 1;
  ritual.smoke = 0;
  ritual.holdPinch = 0;
  ritual.holdFinger = 0;
  setStatus(`蜡烛已点燃（${source}）· 比个 1 ☝🏻 变出花束`, true);
  syncRitualUI();
}

/** ② 比 1：三层蛋糕 → 3D 发光粒子花束 */
function bouquetMorph(source) {
  if (ritual.stage !== 'lit' || ritual.leaving) return;
  ritual.stage = 'bouquet';
  ritual.t = 0;
  ritual.holdFinger = 0;

  state.bouquetTarget = 1;        // 形态插值：主循环 damp + 着色器 mix
  state.spreadTarget = 0;
  ritual.igniteTarget = 0;        // 烛火柔和淡出

  // 视角自动微调到最适合欣赏花束的角度
  state.distTarget = 5.6;         // 略微拉近，让紧凑饱满的花束成为画面中心
  state.viewPitchTarget = 0.14;
  state.autoSpeed = 0.7;

  setStatus(`花束成型 🌷（${source}）· 比个耶 ✌🏻 让它散成星空`, true);
  syncRitualUI();
}

/** ③ 比耶：从花束散开成星空 + 照片星环 */
function posePhotos(source) {
  if (ritual.stage !== 'bouquet' || ritual.leaving) return;
  ritual.stage = 'posed';
  ritual.t = 0;
  ritual.holdPeace = 0;
  ritual.holdThumb = 0;
  ritual.photoOut = 0;

  state.spreadTarget = 1;
  ritual.wishTarget = 1;
  ritual.wishT = 0;

  const halfNeeded = 5.2;
  const tanHalf = Math.tan((camera.fov * Math.PI) / 360);
  const neededDist = halfNeeded / (tanHalf * Math.max(0.35, camera.aspect));
  state.distTarget = clamp(Math.max(7.4, neededDist / distScale), 7.4, 24);

  photosActive = true;
  photoGroup.visible = true;
  photos.forEach((c, i) => { c.appearAt = i * 0.12; });

  setStatus(`比耶成功 ✌🏻 回忆星环展开 · 比个赞 👍🏻 回到蛋糕`, true);
  syncRitualUI();
}

/** ④ 点赞：照片收起、粒子聚拢回三层蛋糕，烛火重新点亮 */
function gatherBack(source) {
  if (ritual.stage !== 'posed' || ritual.leaving) return;
  ritual.stage = 'gathered';
  ritual.t = 0;
  ritual.holdThumb = 0;

  state.spreadTarget = 0;
  state.bouquetTarget = 0;        // 花束 → 蛋糕
  ritual.igniteTarget = 1;        // 烛火重亮
  ritual.wishTarget = 0;
  state.distTarget = 6.4;
  state.autoSpeed = 1;

  hoveredCard = null;
  photoTipEl.classList.remove('show');
  canvas.style.cursor = 'grab';
  closeViewer();

  setStatus(`点赞成功 👍🏻 蛋糕回来了（${source}）· 闭上眼睛，许个愿吧`, true);
  syncRitualUI();
}

/** ⑤ 许愿：点按钮触发一段柔和反馈动画（无手势） */
function startWish(source) {
  if (ritual.stage !== 'gathered' || ritual.leaving) return;
  ritual.stage = 'wishing';
  ritual.t = 0;
  ritual.wishSeq = 0;
  ritual.wishTarget = 1;          // 暖金许愿光尘螺旋上升
  ritual.wishT = 0;

  state.distTarget = 5.5;         // 镜头轻微推近
  state.autoSpeed = 0.35;         // 放慢旋转

  wishScreenEl.classList.add('show');
  if (wishTextEl) wishTextEl.textContent = '愿望已被星光收藏 ✨';
  wishBarEl.style.width = '0%';

  setStatus(`许愿中（${source}）· 闭上眼睛，默念你的心愿`, true);
  syncRitualUI();
}

/** ⑤→⑥ 许愿完成：光环/光尘必须彻底归零，绝不带进吹蜡烛阶段 */
function finishWish() {
  if (ritual.stage !== 'wishing') return;
  ritual.stage = 'ready';
  ritual.t = 0;

  // 关掉许愿专属特效
  ritual.wishTarget = 0;
  ritual.wish = 0;
  for (const ring of wishRings) {
    ring.material.opacity = 0;
    ring.visible = false;
  }

  state.distTarget = 6.4;
  state.autoSpeed = 1;

  wishScreenEl.classList.remove('show');
  setStatus('愿望已封存 ✨ 现在可以吹灭蜡烛了', true);
  syncRitualUI();

  // 进入吹灭环节：自动尝试开启麦克风（被拒绝也不影响按钮兜底）
  enableMic();
}

/** ⑥ 吹灭蜡烛 → 庆祝转场 */
function blowOut(source) {
  if (ritual.stage !== 'ready' || ritual.leaving) return;
  ritual.stage = 'blown';
  ritual.leaving = true;
  ritual.t = 0;
  ritual.igniteTarget = 0;
  ritual.smoke = 1;
  ritual.smokeT = 0;
  ritual.burstTarget = 1;
  ritual.wishTarget = 0;
  ritual.air = 0;
  stopMic();

  // 兜底：确保许愿光环已彻底隐藏（正常流程在 finishWish 里已清）
  for (const ring of wishRings) {
    ring.material.opacity = 0;
    ring.visible = false;
  }

  document.body.classList.add('celebrating');
  setStatus(`蜡烛已吹灭（${source}）· 愿望已寄出`, true);
  syncRitualUI();
  startGiftTransition();
}

const giftTimers = [];

function startGiftTransition() {
  requestAnimationFrame(() => { giftCardEl.classList.add('show'); });
  requestAnimationFrame(() => {
    giftBarEl.style.transition = `width ${TRANSITION.hold}ms linear`;
    giftBarEl.style.width = '100%';
  });

  giftTimers.push(setTimeout(() => {
    giftMaskEl.classList.add('show');
    giftTimers.push(setTimeout(goToCard, TRANSITION.fade + TRANSITION.navDelay));
  }, TRANSITION.hold));
}

function goToCard() {
  giftTimers.forEach(clearTimeout);
  giftTimers.length = 0;
  window.location.href = CARD_URL;
}

$('gift-open').addEventListener('click', () => {
  giftMaskEl.classList.add('show');
  setTimeout(goToCard, 260);
});

/* ---------- 13.1 步骤条 + 动作面板 ---------- */
function syncRitualUI() {
  const idx = stageIndex(ritual.stage);
  stepperEl.innerHTML = STEPS.map((name, i) => {
    const cls = i < idx ? 'step done' : (i === idx ? 'step active' : 'step');
    return `${i ? '<span class="step-div"></span>' : ''}` +
      `<span class="${cls}"><i>${i + 1}</i>${name}</span>`;
  }).join('');

  let html = '';
  switch (ritual.stage) {
    case 'unlit':
      html = `<span class="ritual-label">① 点燃蜡烛</span>
        <button class="btn primary" data-act="ignite">点燃蜡烛</button>
        <span class="ritual-tip">点蜡烛火焰 / 捏合手势保持 0.8 秒</span>`;
      break;
    case 'lit':
      html = `<span class="ritual-label">② 比 1 ☝🏻 变出花束</span>
        <button class="btn primary" data-act="bouquet">比 1 / 变成花束</button>
        <span class="ritual-tip">只伸食指，中指·无名指·小指收拢，保持 0.7 秒</span>`;
      break;
    case 'bouquet':
      html = `<span class="ritual-label">③ 比耶 ✌🏻 让花束散成星空</span>
        <button class="btn primary" data-act="peace">比耶 / 展开照片</button>
        <span class="ritual-tip">食指+中指伸直，其余收拢，保持 0.7 秒</span>`;
      break;
    case 'posed':
      html = `<span class="ritual-label">④ 比个赞 👍🏻 回到蛋糕</span>
        <button class="btn primary" data-act="gather">回到蛋糕形状</button>
        <span class="ritual-tip">拇指向上、四指收拢，保持 0.7 秒</span>`;
      break;
    case 'gathered':
      html = `<span class="ritual-label">⑤ 闭上眼睛，默念你的心愿</span>
        <button class="btn primary" data-act="wish">愿你愿望成真！</button>
        <span class="ritual-tip">许下心愿后进入最后一步：吹灭蜡烛</span>`;
      break;
    case 'wishing':
      html = `<span class="ritual-label">许愿中…</span>
        <span class="ritual-tip">愿望会被星光带走</span>`;
      break;
    case 'ready':
      html = `<span class="ritual-label">⑥ 吹灭蜡烛</span>
        <button class="btn primary" data-act="blow">吹灭蜡烛</button>
        ${micOn
          ? `<span class="mic-meter" title="麦克风实时电平"><i id="mic-fill"></i></span>
             <label class="mic-sens-wrap" title="麦克风灵敏度：吹不动可以往右拉">灵敏度
               <input id="mic-sens" type="range" min="0" max="100" value="${Math.round(MIC.sens * 100)}">
             </label>`
          : `<button class="btn" data-act="mic">开启麦克风吹气</button>`}
        <span class="ritual-tip">${micOn ? '对着麦克风吹气约 0.6 秒' : '或点上方按钮吹灭'}</span>`;
      break;
    case 'blown':
      html = `<span class="ritual-label">⑥ 蜡烛已熄灭 · 愿望已寄出</span>
        <span class="ritual-tip">正在为你开启专属信件…</span>`;
      break;
  }
  ritualEl.innerHTML = html;
  layoutRitual();
}

function layoutRitual() {
  const controlsTop = document.querySelector('.controls').getBoundingClientRect().top;
  const ritualBottom = window.innerHeight - controlsTop + 10;
  ritualEl.style.bottom = Math.max(10, ritualBottom) + 'px';
  hintEl.style.bottom = (ritualBottom + ritualEl.offsetHeight + 10) + 'px';
}
window.addEventListener('resize', layoutRitual);

ritualEl.addEventListener('click', e => {
  const btn = e.target.closest('[data-act]');
  if (!btn) return;
  switch (btn.dataset.act) {
    case 'ignite':  igniteCandle('按钮'); break;
    case 'bouquet': bouquetMorph('按钮'); break;
    case 'peace':   posePhotos('按钮'); break;
    case 'gather':  gatherBack('按钮'); break;
    case 'wish':    startWish('按钮'); break;
    case 'blow':    blowOut('按钮'); break;
    case 'mic':     enableMic(); break;
  }
});

ritualEl.addEventListener('input', e => {
  if (e.target.id === 'mic-sens') MIC.sens = clamp01(e.target.value / 100);
});

/* ============================================================================
   14. 尺寸自适应
   ========================================================================== */
function onResize() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  const pr = Math.min(window.devicePixelRatio || 1, 2);

  renderer.setPixelRatio(pr);
  renderer.setSize(w, h, false);

  camera.aspect = w / h;
  camera.updateProjectionMatrix();

  const aspect = w / h;
  distScale = aspect >= 1 ? 1 : Math.min(1.9, 0.8 / aspect);

  const s = clamp(Math.min(w, h) / 860, 0.62, 1.2);
  cakeMat.uniforms.uPixelRatio.value = pr;
  cakeMat.uniforms.uSize.value = s;
  dustMat.uniforms.uPixelRatio.value = pr;
  dustMat.uniforms.uSize.value = s;
}
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', () => setTimeout(onResize, 120));
onResize();

/* ============================================================================
   15. 主循环
   ========================================================================== */
const clock = new THREE.Clock();
let fpsAcc = 0;
let fpsFrames = 0;
let orbitTime = 0;

function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  /* ---- 状态插值 ---- */
  state.spread = damp(state.spread, state.spreadTarget, 2.2, dt);
  state.bouquet = damp(state.bouquet, state.bouquetTarget, 1.8, dt);
  state.viewYaw = damp(state.viewYaw, state.viewYawTarget, 6.0, dt);
  state.viewPitch = damp(state.viewPitch, state.viewPitchTarget, 5.0, dt);
  state.dist = damp(state.dist, state.distTarget, 4.0, dt);
  state.flame = damp(state.flame, state.flameTarget, 6.0, dt);
  state.handSpin = damp(state.handSpin, state.handSpinTarget, 3.2, dt);

  /* ---- 仪式推进 ---- */
  ritual.t += dt;

  ritual.ignite = damp(ritual.ignite, ritual.igniteTarget, ritual.igniteTarget > ritual.ignite ? 5.0 : 3.0, dt);
  if (ritual.igniteTarget === 0 && ritual.ignite > 0.02) {
    ritual.ignite *= 0.86 + Math.random() * 0.26;
  }

  ritual.burst = damp(ritual.burst, ritual.burstTarget, 1.7, dt);

  if (ritual.leaving) {
    ritual.burstT += dt;
    const f = clamp01(ritual.burstT / 1.4);
    burstGlow.visible = f < 1;
    burstGlow.scale.setScalar(2.5 + f * 12.5);
    burstGlow.material.opacity = (1 - f) * 0.85;
  }

  if (ritual.stage === 'blown') {
    ritual.smokeT += dt;
    ritual.smoke = Math.max(0, ritual.smoke - dt * 0.14);
  }

  if (ritual.stage === 'posed') {
    state.spreadTarget = 1;
    ritual.wishT += dt;
  }
  ritual.wish = damp(ritual.wish, ritual.wishTarget, 1.2, dt);

  /* ---- ⑤ 许愿：柔和反馈动画（纯点击触发，无手势） ---- */
  if (ritual.stage === 'wishing') {
    ritual.wishSeq += dt;
    wishBarEl.style.width = (clamp01(ritual.wishSeq / WISH_DURATION) * 100) + '%';
    if (ritual.wishSeq >= WISH_DURATION) finishWish();
  }

  /* ---- 许愿光环：只在 wishing 阶段渲染 ----
     离开该阶段后立刻停止位置更新，透明度归零并隐藏，绝不带进吹蜡烛画面 */
  const wishing = ritual.stage === 'wishing';
  for (let i = 0; i < wishRings.length; i++) {
    const ring = wishRings[i];
    if (wishing) {
      const ph = (ritual.wishSeq / WISH_DURATION + i * 0.5) % 1;
      ring.visible = true;
      ring.position.y = -0.35 + ph * 2.9;
      ring.scale.setScalar(0.75 + ph * 0.55);
      ring.material.opacity = Math.sin(ph * Math.PI) * 0.5;
    } else if (ring.visible) {
      ring.material.opacity = Math.max(0, ring.material.opacity - dt * 6);
      if (ring.material.opacity <= 0.01) {
        ring.material.opacity = 0;
        ring.visible = false;
      }
    }
  }

  /* ---- 麦克风吹气（只在"待吹灭"阶段生效） ---- */
  if (micOn && ritual.stage === 'ready') {
    const b = detectBlow();
    ritual.air = damp(ritual.air, b, 10, dt);

    if (b > 0.22) {
      ritual.blowScore = clamp01(ritual.blowScore + dt * (0.7 + b * 1.3));
      setStatus(`吹气中 ${Math.round(ritual.blowScore * 100)}% · 继续`, true);
    } else {
      ritual.blowScore = clamp01(ritual.blowScore - dt * 1.2);
      // 分情况给出可操作的提示，而不是干等
      if (MIC.silent > 150) {
        setStatus('麦克风没有收到声音 · 请检查系统输入设备，或点「开启麦克风吹气」重试');
      } else if (audioCtx && audioCtx.state !== 'running') {
        setStatus('音频被浏览器挂起 · 点一下页面任意处即可启用');
      } else {
        setStatus('对着麦克风吹气（右侧电平条会跳动）', true);
      }
    }

    // 电平条显示实时输入电平——先让用户确认"麦克风确实在收音"
    const fill = document.getElementById('mic-fill');
    if (fill) {
      fill.style.width = (MIC.level * 100) + '%';
      fill.classList.toggle('hot', MIC.level > 0.4);
    }

    if (ritual.blowScore >= 1) blowOut('麦克风吹气');
  } else {
    ritual.air = damp(ritual.air, 0, 8, dt);
  }

  /* ---- 照片星环 ---- */
  if (photosActive) {
    if (ritual.stage === 'gathered' || ritual.leaving) {
      ritual.photoOut = Math.min(1, ritual.photoOut + dt * 0.9);
    }
    const fade = 1 - ritual.photoOut;
    if (fade <= 0.01) {
      photosActive = false;
      photoGroup.visible = false;
    }

    const slow = hoveredCard ? 0.32 : 1;
    orbitTime += dt * slow;

    for (const c of photos) {
      const localT = clamp01((ritual.t - (c.appearAt || 0)) / 0.9);
      c.appear = damp(c.appear, localT, 6, dt);

      const a = c.angle0 + orbitTime * c.speed;
      const r = c.radius + ritual.photoOut * 2.4;      // 收起时向外飘散
      c.mesh.position.set(
        Math.cos(a) * r,
        c.y0 + Math.sin(t * 0.9 + c.index * 1.7) * 0.22 + ritual.photoOut * 0.8,
        Math.sin(a) * r
      );
      // 朝向相机（Billboard），再叠一点点"呼吸"微倾，避免死板
      c.mesh.lookAt(camera.position);
      c.mesh.rotateZ(Math.sin(t * 0.6 + c.index * 1.3) * 0.035);

      const hoverT = c === hoveredCard ? 1 : 0;
      c.hover = damp(c.hover, hoverT, 8, dt);

      const pop = c.appear * (1 + c.hover * 0.14) * (1 - ritual.photoOut * 0.35);
      c.mesh.scale.setScalar(Math.max(0.001, pop));

      c.mat.opacity = clamp01(c.appear) * (0.9 + c.hover * 0.1) * fade;
      c.haloMat.opacity = clamp01(c.appear) * (0.20 + c.hover * 0.30) * fade;
      c.glowMat.opacity = clamp01(c.appear) * (0.10 + c.hover * 0.80) * fade;
    }

    if (!ritual.leaving && fade > 0.5) {
      raycaster.setFromCamera(pointerNDC, camera);
      const hits = raycaster.intersectObjects(photoGroup.children, false);
      const prev = hoveredCard;
      hoveredCard = hits.length ? hits[0].object.userData.card : null;

      if (hoveredCard !== prev) {
        if (hoveredCard && hoveredCard.item.caption) {
          photoTipEl.textContent = hoveredCard.item.caption;
          photoTipEl.classList.add('show');
        } else {
          photoTipEl.classList.remove('show');
        }
      }
      if (!dragging) canvas.style.cursor = hoveredCard ? 'pointer' : 'grab';
    } else {
      hoveredCard = null;
      photoTipEl.classList.remove('show');
    }
  }

  // caption 胶囊跟随指针
  if (hoveredCard) {
    photoTipEl.style.left = pointerX + 'px';
    photoTipEl.style.top = pointerY - 14 + 'px';
  }

  /* ---- 蛋糕自转 ---- */
  if (!gesture.active && !dragging) state.autoSpin += dt * 0.15 * state.autoSpeed;
  cakeGroup.rotation.y = damp(cakeGroup.rotation.y, state.handSpin + state.autoSpin, 2.6, dt);
  cakeGroup.position.y = Math.sin(t * 0.9) * 0.018;

  /* ---- uniforms ---- */
  cakeMat.uniforms.uTime.value = t;
  cakeMat.uniforms.uSpread.value = state.spread;
  cakeMat.uniforms.uBouquet.value = state.bouquet;
  cakeMat.uniforms.uFlame.value = state.flame;
  cakeMat.uniforms.uIgnite.value = ritual.ignite;
  cakeMat.uniforms.uBurst.value = ritual.burst;
  cakeMat.uniforms.uSmoke.value = ritual.smoke;
  cakeMat.uniforms.uSmokeT.value = ritual.smokeT;
  cakeMat.uniforms.uAir.value = ritual.air;

  dustMat.uniforms.uTime.value = t;
  dustMat.uniforms.uSpread.value = state.spread;
  dustMat.uniforms.uWish.value = ritual.wish;
  dustMat.uniforms.uWishT.value = ritual.wishT;
  dustMat.uniforms.uBurst.value = ritual.burst;
  dustPoints.rotation.y = t * 0.012;

  /* ---- 光晕 ---- */
  const ignite = ritual.ignite;
  const breath = 1 + Math.sin(t * 6.0) * 0.06 + state.flame * 0.04;
  flameGlow.scale.setScalar(1.5 * breath * (0.55 + 0.45 * ignite) * (1 - ritual.air * 0.35));
  flameGlow.material.opacity = clamp((0.55 + 0.35 * state.flame + Math.sin(t * 11) * 0.04) * ignite * (1 - ritual.air * 0.4), 0, 1);
  flameGlow.visible = ignite > 0.02;

  groundGlow.material.opacity = 0.36 + state.flame * 0.08 + Math.sin(t * 2.2) * 0.03;
  groundGlow.material.opacity *= (0.45 + 0.55 * ignite) * (1 + ritual.burst * 1.6);
  groundGlow.scale.setScalar(1 + ritual.burst * 0.55);

  /* ---- 相机 ---- */
  const dist = state.dist * distScale;
  const cosP = Math.cos(state.viewPitch);
  camera.position.set(
    Math.sin(state.viewYaw) * cosP * dist,
    Math.sin(state.viewPitch) * dist + CAKE_CENTER_Y,
    Math.cos(state.viewYaw) * cosP * dist
  );
  camera.lookAt(0, CAKE_CENTER_Y, 0);

  /* ---- 进度条兜底 ---- */
  if (!cameraOn) {
    barOpen.style.width = (state.spread * 100) + '%';
    barPinch.style.width = '0%';
  }

  /* ---- FPS ---- */
  fpsAcc += dt;
  fpsFrames++;
  if (fpsAcc >= 0.5) {
    fpsEl.textContent = Math.round(fpsFrames / fpsAcc) + ' FPS · ' +
      (cakePoints.geometry.attributes.position.count + DUST_N) + ' 粒子';
    fpsAcc = 0;
    fpsFrames = 0;
  }

  renderer.render(scene, camera);
}

/* ============================================================================
   16. 启动
   ========================================================================== */
setCamUI(false);
syncRitualUI();
animate();

cakeMat.uniforms.uIgnite.value = 0;
cakeMat.uniforms.uBurst.value = 0;
cakeMat.uniforms.uSmoke.value = 0;
cakeMat.uniforms.uAir.value = 0;
flameGlow.visible = false;

// 任何一次点击都尝试恢复 AudioContext（浏览器自动播放策略）
window.addEventListener('pointerdown', () => {
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
}, { passive: true });

window.__cakeDebug = {
  ritual, state, gesture, renderer, camera, analyzeHand, onHandResults,
  CARD_URL, MEMORY_PHOTOS, photoGroup, photos,
  igniteCandle, bouquetMorph, posePhotos, gatherBack, startWish, finishWish, blowOut, openViewer,
  enableMic, detectBlow, classifyBlow, MIC,
  bouquetTargets, wishRings,
  micOn: () => micOn,
  micState: () => micOn ? { state: audioCtx?.state, rms: +MIC.rms.toFixed(4), flat: +MIC.flatness.toFixed(3), low: +MIC.lowRatio.toFixed(3), level: +MIC.level.toFixed(3) } : null
};

window.__cakeReady = true;
requestAnimationFrame(() => {
  bootEl.classList.add('hide');
  setTimeout(() => { bootEl.style.display = 'none'; }, 800);
});

document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    if (cameraOn) stopCamera();
    if (micOn) stopMic();
  }
});
</script>
</body>
</html>
