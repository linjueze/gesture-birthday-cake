<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>手势控制 · 3D 发光粒子生日蛋糕 · 比耶星环</title>
<style>
  :root{
    --gold:#ffcf8a;
    --gold-soft:#ffb45a;
    --cream:#f7e8d4;
    --line:rgba(255,207,138,.18);
    --line-strong:rgba(255,207,138,.34);
    --panel:rgba(13,15,22,.66);
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;height:100%;overflow:hidden;background:#06070c;color:var(--cream);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #scene{
    position:fixed;inset:0;display:block;width:100%;height:100%;
    touch-action:none;cursor:grab;
  }
  #scene.dragging{cursor:grabbing}

  .vignette{
    position:fixed;inset:0;pointer-events:none;z-index:2;
    background:
      radial-gradient(ellipse 62% 58% at 50% 46%,rgba(0,0,0,0) 40%,rgba(0,0,0,.48) 100%),
      linear-gradient(180deg,rgba(6,7,12,.72),rgba(6,7,12,0) 26%,rgba(6,7,12,0) 72%,rgba(6,7,12,.78));
  }

  .ui{position:fixed;inset:0;z-index:3;pointer-events:none}
  .ui > *{pointer-events:auto}

  /* ---------- 品牌 ---------- */
  .brand{
    position:absolute;top:22px;left:26px;pointer-events:none;
    text-shadow:0 2px 18px rgba(0,0,0,.6);
  }
  .brand h1{
    margin:0;font-size:19px;font-weight:600;letter-spacing:.06em;
    background:linear-gradient(100deg,#ffe9c9,#ffc078 62%,#ff9f7a);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  }
  .brand p{
    margin:6px 0 0;font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;
    color:rgba(255,226,190,.5);
  }

  /* ---------- 步骤条（6 步，紧凑 + 可换行） ---------- */
  .stepper{
    position:absolute;top:22px;left:50%;transform:translateX(-50%);
    display:flex;gap:5px;align-items:center;justify-content:center;flex-wrap:wrap;
    row-gap:5px;
    /* 两侧给品牌与手势面板留位，避免 6 步变宽后重叠 */
    max-width:min(880px, calc(100vw - 620px));
    padding:6px 14px;border-radius:18px;
    background:var(--panel);border:1px solid var(--line);
    backdrop-filter:blur(16px) saturate(150%);
    -webkit-backdrop-filter:blur(16px) saturate(150%);
    box-shadow:0 12px 32px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.05);
    font-size:11px;letter-spacing:.03em;pointer-events:none;
    transition:opacity .9s ease;
  }
  .step{display:flex;align-items:center;gap:5px;color:rgba(255,226,190,.32);transition:color .55s ease;white-space:nowrap}
  .step i{
    width:17px;height:17px;border-radius:50%;display:grid;place-items:center;
    border:1px solid rgba(255,207,138,.22);font-style:normal;font-size:9.5px;line-height:1;
    transition:all .55s ease;flex:none;
  }
  .step.active{color:#ffe4bd}
  .step.active i{
    background:linear-gradient(135deg,#ffd79a,#ffab5e);color:#2a1708;
    border-color:transparent;box-shadow:0 0 16px rgba(255,170,90,.65);
  }
  .step.done{color:rgba(255,226,190,.62)}
  .step.done i{background:rgba(255,207,138,.16);border-color:rgba(255,207,138,.42);color:#ffd79a}
  .step-div{width:10px;height:1px;background:rgba(255,207,138,.18);flex:none}

  /* ---------- 许愿倒计时（3 秒沉浸） ---------- */
  .wish-screen{
    position:fixed;left:50%;top:44%;transform:translate(-50%,-50%) scale(.96);
    z-index:4;text-align:center;pointer-events:none;
    opacity:0;transition:opacity .8s ease,transform .8s ease;
  }
  .wish-screen.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
  .wish-screen .wish-kicker{
    font-size:11.5px;letter-spacing:.42em;text-transform:uppercase;
    color:rgba(255,214,160,.62);margin-bottom:16px;
  }
  .wish-screen .wish-num{
    font-size:clamp(46px,7vw,78px);font-weight:300;line-height:1;
    font-family:"Songti SC","STSong",Georgia,serif;
    background:linear-gradient(100deg,#fff8e8,#ffd08a 50%,#ffab7a);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    filter:drop-shadow(0 0 30px rgba(255,170,90,.5));
    transition:opacity .2s;
  }
  .wish-screen .wish-text{
    margin-top:14px;font-size:15px;letter-spacing:.12em;color:rgba(255,236,214,.88);
    text-shadow:0 0 20px rgba(255,170,90,.35);
  }
  .wish-screen .wish-track{
    width:190px;height:3px;border-radius:99px;margin:20px auto 0;
    background:rgba(255,255,255,.1);overflow:hidden;
  }
  .wish-screen .wish-track i{
    display:block;height:100%;width:0%;border-radius:99px;
    background:linear-gradient(90deg,#ffb45a,#ffe7bd);
    box-shadow:0 0 12px rgba(255,190,110,.85);
  }

  /* ---------- 摄像头卡片 ---------- */
  .cam-card{
    position:absolute;top:22px;right:26px;width:268px;
    background:var(--panel);border:1px solid var(--line);border-radius:18px;
    padding:12px;backdrop-filter:blur(16px) saturate(150%);
    -webkit-backdrop-filter:blur(16px) saturate(150%);
    box-shadow:0 18px 48px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.05);
    transition:opacity .9s ease;
  }
  .cam-head{
    display:flex;align-items:center;justify-content:space-between;
    font-size:11px;letter-spacing:.16em;text-transform:uppercase;
    color:rgba(255,226,190,.55);margin:2px 2px 10px;
  }
  .dot{
    width:7px;height:7px;border-radius:50%;background:#5a5f6e;
    box-shadow:0 0 0 0 rgba(255,160,90,.5);transition:background .3s;
  }
  .dot.live{background:#7dffb0;box-shadow:0 0 10px rgba(125,255,176,.85);animation:pulse 1.6s infinite}
  .dot.wait{background:#ffc35a;box-shadow:0 0 10px rgba(255,195,90,.7)}
  @keyframes pulse{
    0%,100%{box-shadow:0 0 0 0 rgba(125,255,176,.55)}
    50%{box-shadow:0 0 0 6px rgba(125,255,176,0)}
  }

  .cam-stage{
    position:relative;width:100%;aspect-ratio:4/3;border-radius:12px;overflow:hidden;
    background:radial-gradient(circle at 50% 40%,#12141c,#080910 70%);
    border:1px solid rgba(255,255,255,.06);
  }
  .cam-stage video,.cam-stage canvas{
    position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    transform:scaleX(-1);
  }
  .cam-placeholder{
    position:absolute;inset:0;display:flex;flex-direction:column;gap:6px;
    align-items:center;justify-content:center;text-align:center;
    font-size:12.5px;color:rgba(255,226,190,.6);line-height:1.6;
  }
  .cam-placeholder span{font-size:11px;color:rgba(255,226,190,.34)}

  .status{
    margin-top:10px;padding:9px 11px;border-radius:11px;
    background:rgba(255,207,138,.07);border:1px solid rgba(255,207,138,.12);
    font-size:12.5px;line-height:1.45;color:#ffe4bd;min-height:38px;
    display:flex;align-items:center;
  }
  .status.active{background:rgba(126,255,178,.09);border-color:rgba(126,255,178,.28);color:#c9ffdf}

  .meters{margin-top:9px;display:flex;flex-direction:column;gap:7px}
  .meter{display:flex;align-items:center;gap:9px;font-size:10.5px;color:rgba(255,226,190,.5)}
  .meter > span{width:36px;flex:none;letter-spacing:.08em}
  .bar{flex:1;height:4px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
  .bar i{
    display:block;height:100%;width:0%;border-radius:99px;
    background:linear-gradient(90deg,#ffb45a,#ffe3b0);
    box-shadow:0 0 10px rgba(255,180,90,.65);
  }

  /* ---------- 仪式动作面板 ---------- */
  .ritual{
    position:absolute;left:50%;bottom:112px;transform:translateX(-50%);
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;
    padding:10px 16px;border-radius:20px;
    max-width:min(780px,calc(100vw - 32px));min-height:56px;
    background:var(--panel);border:1px solid var(--line);
    backdrop-filter:blur(16px) saturate(150%);
    -webkit-backdrop-filter:blur(16px) saturate(150%);
    box-shadow:0 16px 44px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.05);
    transition:opacity .45s ease,transform .45s ease;
    font-size:13px;
  }
  .ritual-label{font-size:12.5px;letter-spacing:.06em;color:#ffe4bd;white-space:nowrap}
  .ritual-tip{font-size:11px;color:rgba(255,226,190,.4);white-space:nowrap}
  .mic-meter{
    width:74px;height:4px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;
  }
  .mic-meter i{
    display:block;height:100%;width:0%;border-radius:99px;
    background:linear-gradient(90deg,#7dd3fc,#a7f3d0);transition:width .06s linear;
  }
  .mic-meter i.hot{background:linear-gradient(90deg,#a7f3d0,#fde68a)}

  .mic-sens-wrap{
    display:flex;align-items:center;gap:6px;white-space:nowrap;
    font-size:10.5px;letter-spacing:.06em;color:rgba(255,226,190,.5);
  }
  .mic-sens-wrap input[type="range"]{
    -webkit-appearance:none;appearance:none;
    width:76px;height:4px;border-radius:99px;outline:none;cursor:pointer;
    background:rgba(255,255,255,.12);
  }
  .mic-sens-wrap input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;
    width:12px;height:12px;border-radius:50%;
    background:linear-gradient(135deg,#ffd79a,#ffab5e);
    box-shadow:0 0 8px rgba(255,180,90,.65);
  }
  .mic-sens-wrap input[type="range"]::-moz-range-thumb{
    width:12px;height:12px;border:none;border-radius:50%;
    background:#ffcf8a;box-shadow:0 0 8px rgba(255,180,90,.65);
  }

  /* ---------- 底部控制条 ---------- */
  .controls{
    position:absolute;left:50%;bottom:30px;transform:translateX(-50%);
    display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;
    padding:9px;border-radius:999px;
    background:var(--panel);border:1px solid var(--line);
    backdrop-filter:blur(16px) saturate(150%);
    -webkit-backdrop-filter:blur(16px) saturate(150%);
    box-shadow:0 16px 40px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.05);
    max-width:calc(100vw - 32px);
    transition:opacity .9s ease;
  }
  .btn{
    appearance:none;border:1px solid rgba(255,207,138,.22);
    background:rgba(255,214,160,.06);color:#ffeacb;
    font:inherit;font-size:13px;letter-spacing:.05em;
    padding:9px 17px;border-radius:999px;cursor:pointer;
    transition:background .2s,border-color .2s,transform .12s,box-shadow .2s;
    white-space:nowrap;
  }
  .btn:hover{background:rgba(255,214,160,.16);border-color:rgba(255,207,138,.42)}
  .btn:active{transform:scale(.96)}
  .btn.primary{
    background:linear-gradient(135deg,#ffd79a,#ffab5e);
    color:#2a1708;border-color:transparent;font-weight:600;
    box-shadow:0 6px 20px rgba(255,160,80,.28);
  }
  .btn.primary:hover{background:linear-gradient(135deg,#ffe2b0,#ffb974)}
  .btn.primary.on{background:linear-gradient(135deg,#9dffc6,#57d99a);color:#06281a}
  .btn.ghost{background:transparent}
  .btn:disabled{opacity:.5;cursor:default}

  .hint{
    position:absolute;left:50%;bottom:84px;transform:translateX(-50%);
    font-size:11.5px;letter-spacing:.1em;color:rgba(255,226,190,.36);
    pointer-events:none;text-align:center;white-space:nowrap;
    transition:opacity .9s ease;
  }
  .fps{
    position:absolute;left:26px;bottom:26px;font-size:11px;letter-spacing:.14em;
    color:rgba(255,226,190,.34);font-variant-numeric:tabular-nums;pointer-events:none;
  }

  /* ---------- 悬停照片时的 caption 胶囊 ---------- */
  .photo-tip{
    position:fixed;z-index:5;pointer-events:none;
    transform:translate(-50%,-140%) scale(.94);
    padding:7px 15px;border-radius:999px;white-space:nowrap;
    background:rgba(20,16,12,.78);border:1px solid rgba(255,214,160,.35);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    font-size:12px;letter-spacing:.04em;color:#ffe9c9;
    box-shadow:0 10px 28px rgba(0,0,0,.5),0 0 20px rgba(255,180,90,.16);
    opacity:0;transition:opacity .25s ease,transform .25s ease;
  }
  .photo-tip.show{opacity:1;transform:translate(-50%,-160%) scale(1)}

  /* ============================================================
     照片灯箱
     ============================================================ */
  .viewer{
    position:fixed;inset:0;z-index:6;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(ellipse 70% 60% at 50% 45%,rgba(10,8,6,.62),rgba(3,3,6,.9));
    backdrop-filter:blur(14px) saturate(130%);
    -webkit-backdrop-filter:blur(14px) saturate(130%);
    opacity:0;pointer-events:none;transition:opacity .45s ease;
  }
  .viewer.show{opacity:1;pointer-events:auto}

  .viewer-inner{
    display:flex;flex-direction:column;align-items:center;gap:16px;
    transform:translateY(10px) scale(.98);
    transition:transform .5s cubic-bezier(.2,.85,.25,1);
  }
  .viewer.show .viewer-inner{transform:translateY(0) scale(1)}

  .viewer-frame{position:relative;display:flex;align-items:center;justify-content:center}

  .viewer-stage{
    position:relative;width:min(720px,78vw);aspect-ratio:3/2;
    border-radius:24px;padding:10px;
    background:linear-gradient(150deg,#f6e8d2,#cfae7e 55%,#a8825a);
    box-shadow:
      0 40px 100px rgba(0,0,0,.75),
      0 0 0 1px rgba(255,226,182,.35),
      inset 0 1px 0 rgba(255,255,255,.55);
  }
  .viewer-stage .viewer-photo{
    position:relative;width:100%;height:100%;border-radius:16px;overflow:hidden;
    background:#120e0a;box-shadow:inset 0 0 40px rgba(0,0,0,.55);
  }
  .viewer-stage img{
    width:100%;height:100%;object-fit:cover;display:block;
    opacity:0;transform:scale(1.02);
    transition:opacity .55s ease,transform .9s cubic-bezier(.2,.8,.2,1);
  }
  .viewer-stage img.loaded{opacity:1;transform:scale(1)}
  .viewer-skel{
    position:absolute;inset:0;
    background:linear-gradient(100deg,#1a140e 20%,#2b2116 40%,#1a140e 60%);
    background-size:220% 100%;
    animation:shimmer 1.4s linear infinite;
    transition:opacity .4s ease;
  }
  .viewer-skel.hide{opacity:0}
  @keyframes shimmer{0%{background-position:120% 0}100%{background-position:-120% 0}}
  .viewer-fallback{
    position:absolute;inset:0;display:none;place-items:center;font-size:54px;
    color:rgba(255,226,190,.8);
    background:radial-gradient(circle at 50% 45%,#4a2c14,#1a120c 78%);
  }

  .viewer-nav{
    position:absolute;top:50%;margin-top:-23px;z-index:2;
    width:46px;height:46px;border-radius:50%;flex:none;
    border:1px solid rgba(255,207,138,.30);background:rgba(16,12,9,.55);
    color:#ffeacb;font-size:22px;line-height:1;cursor:pointer;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    box-shadow:0 8px 24px rgba(0,0,0,.45);
    transition:background .2s,transform .15s,border-color .2s;
  }
  .viewer-nav[data-v="prev"]{left:14px}
  .viewer-nav[data-v="next"]{right:14px}
  .viewer-nav:hover{background:rgba(255,214,160,.2);border-color:rgba(255,207,138,.5)}
  .viewer-nav:active{transform:scale(.93)}

  .viewer-close{
    position:absolute;top:22px;right:26px;width:42px;height:42px;border-radius:50%;
    border:1px solid rgba(255,207,138,.28);background:rgba(20,16,12,.6);
    color:#ffeacb;font-size:16px;cursor:pointer;line-height:1;
    transition:background .2s,transform .15s;
  }
  .viewer-close:hover{background:rgba(255,214,160,.18)}
  .viewer-close:active{transform:scale(.94)}

  .viewer-cap{
    display:flex;align-items:center;gap:12px;
    max-width:min(720px,78vw);
    font-size:14px;letter-spacing:.05em;color:rgba(255,238,216,.9);
    text-align:center;
  }
  .viewer-idx{
    flex:none;font-size:11px;letter-spacing:.14em;color:rgba(255,226,190,.42);
    font-variant-numeric:tabular-nums;
  }
  .viewer-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}

  /* ============================================================
     庆祝转场
     ============================================================ */
  .gift-card{
    position:fixed;left:50%;top:50%;z-index:7;
    transform:translate(-50%,-46%) scale(.96);
    width:min(440px,calc(100vw - 40px));
    padding:34px 30px 26px;border-radius:26px;text-align:center;
    background:linear-gradient(160deg,rgba(28,22,16,.82),rgba(12,11,16,.9));
    border:1px solid rgba(255,207,138,.24);
    backdrop-filter:blur(20px) saturate(160%);
    -webkit-backdrop-filter:blur(20px) saturate(160%);
    box-shadow:0 40px 100px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.08);
    opacity:0;pointer-events:none;
    transition:opacity .9s ease, transform 1s cubic-bezier(.2,.85,.25,1);
  }
  .gift-card.show{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto}

  .gift-kicker{
    font-size:11.5px;letter-spacing:.42em;text-transform:uppercase;
    color:rgba(255,214,160,.62);margin-bottom:14px;
  }
  .gift-note{margin:0;font-size:14px;line-height:1.8;color:rgba(255,236,214,.82);letter-spacing:.03em}
  .gift-track{
    height:3px;border-radius:99px;margin:22px auto 20px;width:78%;
    background:rgba(255,255,255,.08);overflow:hidden;
  }
  .gift-track i{
    display:block;height:100%;width:0%;border-radius:99px;
    background:linear-gradient(90deg,#ffb45a,#ffe7bd);
    box-shadow:0 0 12px rgba(255,190,110,.85);
  }
  .gift-btn{
    appearance:none;border:none;cursor:pointer;font:inherit;font-size:14.5px;font-weight:600;
    letter-spacing:.06em;padding:14px 34px;border-radius:999px;color:#2a1708;
    background:linear-gradient(135deg,#ffe0ae,#ffab5e);
    box-shadow:0 12px 34px rgba(255,160,80,.42);
    animation:btnGlow 2.2s ease-in-out infinite;
    transition:transform .15s ease;
  }
  .gift-btn:hover{transform:translateY(-1px) scale(1.02)}
  .gift-btn:active{transform:scale(.97)}
  @keyframes btnGlow{
    0%,100%{box-shadow:0 12px 34px rgba(255,160,80,.42),0 0 0 0 rgba(255,190,110,.5)}
    50%{box-shadow:0 14px 40px rgba(255,160,80,.58),0 0 0 12px rgba(255,190,110,0)}
  }
  .gift-sub{margin-top:16px;font-size:11px;letter-spacing:.12em;color:rgba(255,226,190,.34)}

  .gift-mask{
    position:fixed;inset:0;z-index:8;pointer-events:none;opacity:0;
    background:
      radial-gradient(ellipse 70% 60% at 50% 45%,rgba(46,30,12,.82),rgba(4,3,6,.99) 76%),
      linear-gradient(180deg,#0a0703,#030304);
    transition:opacity .8s ease;
  }
  .gift-mask.show{opacity:1}

  body.celebrating .controls,
  body.celebrating .hint,
  body.celebrating .ritual,
  body.celebrating .cam-card{opacity:.12;pointer-events:none}
  body.celebrating .stepper{opacity:.4}

  /* ---------- 启动遮罩 ---------- */
  .boot{
    position:fixed;inset:0;z-index:9;display:flex;flex-direction:column;gap:14px;
    align-items:center;justify-content:center;text-align:center;
    background:#06070c;color:#ffe4bd;font-size:14px;letter-spacing:.08em;
    transition:opacity .7s ease;
  }
  .boot span{font-size:11.5px;color:rgba(255,226,190,.4);letter-spacing:.16em}
  .boot.hide{opacity:0;pointer-events:none}
  .boot .ring{
    width:34px;height:34px;border-radius:50%;
    border:2px solid rgba(255,207,138,.18);border-top-color:#ffcf8a;
    animation:spin 1s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ---------- 响应式 ---------- */
  /* 中等屏：6 步步骤条变宽，收紧面板与品牌，必要时自动换行 */
  @media (max-width:1180px){
    .brand h1{font-size:16px}
    .cam-card{width:220px}
    .stepper{font-size:10.5px;gap:4px;padding:6px 12px}
    .step-div{display:none}
    .step i{width:16px;height:16px;font-size:9px}
  }
  @media (max-width:820px){
    .brand{top:14px;left:14px}
    .brand h1{font-size:14px}
    .brand p{display:none}
    .stepper{
      top:40px;font-size:10px;padding:6px 10px;gap:4px;max-width:calc(100vw - 24px);
    }
    .step i{width:15px;height:15px;font-size:9px}
    .step-div{width:8px}
    .cam-card{top:150px;right:12px;width:160px;padding:8px;border-radius:15px}
    .cam-head{font-size:9.5px;margin-bottom:7px}
    .status{font-size:10.5px;padding:7px 9px;min-height:30px}

<script type="module">
/* ============================================================================
   ★★★  贺卡地址：吹灭蜡烛后跳转到这里  ★★★

const CARD_URL = "https://3dcards.theliang.com/letter/q03wJXlKqAWf";

/* ============================================================================
   ★★★  环绕照片：换成自己的图片即可（url 留空或加载失败自动降级为暖色卡片） ★★★
   ========================================================================== */
const MEMORY_PHOTOS = [
  { url: "https://picsum.photos/seed/cake-01/720/540", caption: "那年冬天的第一块蛋糕" },
  { url: "https://picsum.photos/seed/cake-02/720/540", caption: "一起吹过的蜡烛" },
  { url: "https://picsum.photos/seed/cake-03/720/540", caption: "笑得最开心的一次" },
  { url: "https://picsum.photos/seed/cake-04/720/540", caption: "还没讲完的故事" }
];

const TRANSITION = {
  hold: 2500,
  fade: 800,
  navDelay: 250
};

const PEACE_HOLD = 0.7;    // ✌🏻 确认时长（秒）
const THUMB_HOLD = 0.7;    // 👍🏻 确认时长（秒）
const FINGER_HOLD = 0.7;   // ☝🏻 比 1 确认时长（秒）
const WISH_DURATION = 2.8; // 许愿反馈动画时长（秒）

import * as THREE from 'three';

/* ============================================================================
   0. 工具
   ========================================================================== */
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const clamp01 = v => clamp(v, 0, 1);
const damp = (cur, tar, lambda, dt) => cur + (tar - cur) * (1 - Math.exp(-lambda * dt));
const rand = (a, b) => a + Math.random() * (b - a);
const HEX = h => [((h >> 16) & 255) / 255, ((h >> 8) & 255) / 255, (h & 255) / 255];
const mixC = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const mulC = (c, k) => [clamp01(c[0] * k), clamp01(c[1] * k), clamp01(c[2] * k)];
const jitC = (c, a = 0.045) => [
  clamp01(c[0] + rand(-a, a)),
  clamp01(c[1] + rand(-a, a)),
  clamp01(c[2] + rand(-a, a))
];

const PAL = {
  gold: HEX(0xffcf8a),
  cream: HEX(0xfff3df),
  pink: HEX(0xffb6c3),
  flameCore: HEX(0xfff8d2),
  flameOuter: HEX(0xff6a12),
  trayCore: HEX(0xffd8a2),
  trayMid: HEX(0xb87a3a),
  trayOuter: HEX(0x633a1c),
  dustA: HEX(0x9fc0ff),
  dustB: HEX(0xffe3b0),
  smokeA: HEX(0xe8f2ff),
  smokeB: HEX(0xa9c6e8)
};

/* ============================================================================
   1. 渲染基础
   ========================================================================== */
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({
  canvas, antialias: true, alpha: false, powerPreference: 'high-performance'
});
renderer.setClearColor(0x06070c, 1);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 120);

const cakeGroup = new THREE.Group();
scene.add(cakeGroup);

const state = {
  spread: 0, spreadTarget: 0,
  bouquet: 0, bouquetTarget: 0,   // 0=蛋糕 1=花束
  viewYaw: 0, viewYawTarget: 0,
  viewPitch: 0.18, viewPitchTarget: 0.18,
  dist: 6.4, distTarget: 6.4,
  flame: 1, flameTarget: 1,
  handSpin: 0, handSpinTarget: 0,
  autoSpin: 0,
  autoSpeed: 1                    // 许愿时放慢自转
};
let distScale = 1;

const gesture = {
  active: false,
  lastSeen: 0,
  openness: 0,
  pinch: 0,
  peace: false,
  thumbsUp: false,
  oneFinger: false,
  handCount: 0,
  label: 'none'
};

/* ============================================================================
   2. 仪式状态机（6 步）
   ---------------------------------------------------------------------------
   unlit → lit → bouquet → posed → gathered → wishing → ready → blown
   点燃    花束   照片环绕    回蛋糕    许愿中     待吹灭     已完成
   ========================================================================== */
const ritual = {
  stage: 'unlit',
  t: 0,
  ignite: 0,
  igniteTarget: 0,
  burst: 0,
  burstTarget: 0,
  burstT: 0,
  smoke: 0,
  smokeT: 0,
  air: 0,                 // 吹气强度（驱动火焰摇曳）
  wish: 0,
  wishTarget: 0,
  wishT: 0,
  holdPinch: 0,
  holdPeace: 0,
  holdThumb: 0,
  holdFinger: 0,          // ☝🏻 比 1 保持
  wishSeq: 0,             // 许愿反馈动画进度（秒）
  photoOut: 0,            // 照片淡出进度 0..1
  blowScore: 0,           // 持续吹气累计
  leaving: false
};

/* ============================================================================
   3. 粒子构建
   ========================================================================== */
const buf = { pos: [], sca: [], col: [], size: [], seed: [], flame: [] };
const CAKE_CENTER_Y = 1.05;
const CANDLE_TOP = 2.08;
const FLAME_BASE = CANDLE_TOP + 0.02;

function push(x, y, z, color, size, isFlame = 0) {
  buf.pos.push(x, y, z);
  buf.col.push(color[0], color[1], color[2]);
  buf.size.push(size);
  buf.seed.push(Math.random());
  buf.flame.push(isFlame);

  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(2 * Math.random() - 1);
  const R = 2.2 + Math.pow(Math.random(), 0.65) * 6.0;
  buf.sca.push(
    Math.sin(phi) * Math.cos(theta) * R,
    Math.cos(phi) * R * 0.68 + CAKE_CENTER_Y + 0.7,
    Math.sin(phi) * Math.sin(theta) * R
  );
}

const TIERS = [
  { y0: 0.00, y1: 0.66, r: 1.62, n: 4600, a: 0xffc077, b: 0xfff3df },
  { y0: 0.66, y1: 1.18, r: 1.16, n: 3400, a: 0xffb3c1, b: 0xfff0e6 },
  { y0: 1.18, y1: 1.60, r: 0.78, n: 2400, a: 0xffd79a, b: 0xfffdf7 }
];

for (const T of TIERS) {
  const h = T.y1 - T.y0;
  const cA = HEX(T.a);
  const cB = HEX(T.b);
  const nSide = Math.floor(T.n * 0.54);
  const nTop = Math.floor(T.n * 0.30);
  const nRim = T.n - nSide - nTop;

  for (let i = 0; i < nSide; i++) {
    const ang = Math.random() * Math.PI * 2;
    const t = Math.random();
    const taper = 1 - 0.045 * t;
    const r = T.r * taper * rand(0.982, 1.012);
    const y = T.y0 + t * h;
    push(Math.cos(ang) * r, y, Math.sin(ang) * r, jitC(mixC(cA, cB, 0.12 + 0.6 * t)), rand(1.4, 2.9));
  }
  for (let i = 0; i < nTop; i++) {
    const ang = Math.random() * Math.PI * 2;
    const rr = T.r * Math.sqrt(Math.random()) * 0.97;
    const y = T.y1 + rand(-0.012, 0.012);
    push(Math.cos(ang) * rr, y, Math.sin(ang) * rr, jitC(mixC(cA, cB, 0.55 + 0.45 * Math.random())), rand(1.3, 2.3));
  }
  for (let i = 0; i < nRim; i++) {
    const ang = Math.random() * Math.PI * 2;
    const r = T.r * rand(0.955, 1.005);
    const y = T.y1 + rand(-0.02, 0.02);
    push(Math.cos(ang) * r, y, Math.sin(ang) * r, mulC(mixC(cA, cB, 0.85), 1.12), rand(1.8, 3.4));
  }
}

for (let i = 0; i < 280; i++) {
  const ang = Math.random() * Math.PI * 2;
  const rr = 0.78 * Math.sqrt(Math.random()) * 0.9;
  const c = Math.random() < 0.5 ? PAL.pink : (Math.random() < 0.5 ? PAL.gold : PAL.cream);
  push(Math.cos(ang) * rr, 1.60 + rand(0.005, 0.03), Math.sin(ang) * rr, mulC(c, 1.15), rand(2.0, 3.2));
}

for (let i = 0; i < 520; i++) {
  const ang = Math.random() * Math.PI * 2;
  const y = rand(1.60, CANDLE_TOP);
  const r = 0.048 * rand(0.88, 1.12);
  const c = mixC(HEX(0xfff6e8), HEX(0xffd9d2), Math.random());
  push(Math.cos(ang) * r, y, Math.sin(ang) * r, c, rand(1.3, 2.2));
}
for (let i = 0; i < 36; i++) {
  push(rand(-0.008, 0.008), rand(CANDLE_TOP - 0.02, CANDLE_TOP + 0.035), rand(-0.008, 0.008), HEX(0x4a2b1a), 1.6);
}

for (let i = 0; i < 900; i++) {
  const t = Math.pow(Math.random(), 0.72);
  const y = FLAME_BASE + t * 0.44;
  const rad = 0.115 * Math.sin(Math.PI * Math.pow(t, 0.72)) * rand(0.3, 1.0);
  const ang = Math.random() * Math.PI * 2;
  const c = mixC(PAL.flameCore, PAL.flameOuter, clamp01(t * 1.05 + Math.random() * 0.25));
  push(Math.cos(ang) * rad, y, Math.sin(ang) * rad, c, rand(1.5, 3.6), 1);
}

for (let i = 0; i < 460; i++) {
  const ang = Math.random() * Math.PI * 2;
  const r = 0.05 * Math.sqrt(Math.random());
  const c = mixC(PAL.smokeA, PAL.smokeB, Math.random());
  push(Math.cos(ang) * r, FLAME_BASE + rand(-0.02, 0.06), Math.sin(ang) * r,
    mulC(c, rand(0.6, 1.0)), rand(2.0, 4.2), 2);
}

for (let i = 0; i < 900; i++) {
  const ang = Math.random() * Math.PI * 2;
  const rr = 1.95 * Math.sqrt(Math.random());
  push(Math.cos(ang) * rr, rand(-0.045, -0.02), Math.sin(ang) * rr,
    jitC(mixC(PAL.trayMid, PAL.trayOuter, rr / 1.95)), rand(1.2, 2.0));
}
for (let i = 0; i < 1200; i++) {
  const ang = Math.random() * Math.PI * 2;
  const rr = rand(2.0, 2.22);
  push(Math.cos(ang) * rr, rand(-0.04, 0.0), Math.sin(ang) * rr,
    mulC(mixC(PAL.trayCore, PAL.gold, Math.random()), 1.1), rand(2.0, 3.6));
}
for (let i = 0; i < 500; i++) {
  const ang = Math.random() * Math.PI * 2;
  const rr = rand(2.24, 2.75);
  push(Math.cos(ang) * rr, rand(-0.05, -0.01), Math.sin(ang) * rr,
    mulC(PAL.trayCore, rand(0.22, 0.5)), rand(2.2, 4.0));
}

/* ============================================================================
   3.5 花束目标坐标（比 1 触发）
   ---------------------------------------------------------------------------
   与蛋糕粒子一一对应：第 i 个粒子的花束坐标写进 aBouquet，颜色写进 aBouquetColor。
   一次性生成，之后只在顶点着色器里用 uBouquet 插值，
   不在每帧回写 BufferAttribute（避免掉帧）。

   ✿ 想调整花束大小 / 配色，改本函数顶部的「布局参数」与「配色」即可。
   ========================================================================== */
function buildBouquetTargets(count) {
  const pos = new Float32Array(count * 3);
  const col = new Float32Array(count * 3);
  const siz = new Float32Array(count);
  let w = 0;

  /* ---------------- 配色 ---------------- */
  const C_DEEP = HEX(0xff3b6f);     // 花心：深绯红
  const C_ROSE = HEX(0xff8fb1);     // 中层：玫瑰粉
  const C_EDGE = HEX(0xfff0d9);     // 花瓣边缘：亮奶白 / 香槟金
  const C_CHAMP = HEX(0xffe6c7);
  const C_STAR = HEX(0xfff7e8);     // 满天星
  const C_LEAF_A = HEX(0x52b788);   // 衬叶
  const C_LEAF_B = HEX(0x74c69d);
  const C_PAPER_A = HEX(0xf3cfa4);  // 包装纸
  const C_PAPER_B = HEX(0xd9a46f);
  const C_RIB_A = HEX(0xffcf70);    // 丝带亮金
  const C_RIB_B = HEX(0xffb45a);
  const C_STEM = HEX(0x4a8d6b);

  /* ---------------- 布局参数（整体 y ∈ [0.05, 2.35]，中心 ≈ 1.20） ---------------- */
  const STEM_TOP_Y = 0.58;          // 花茎上端（收腰内）
  const STEM_BOT_Y = 0.05;          // 花茎下端
  const BOW_Y = 0.56;               // 收腰丝带 / 蝴蝶结
  const PAPER_BOT_Y = 0.52;         // 包装纸收腰
  const PAPER_BOT_R = 0.15;
  const PAPER_TOP_R = 0.92;         // 包装纸开口半径
  const PAPER_TOP_MID = 1.68;       // 开口高度基准
  const PAPER_TOP_TILT = 0.20;      // 前低（1.48）后高（1.88）的斜杯口
  const DOME_C = { x: 0, y: 1.98, z: 0.05 };   // 主玫瑰中心
  const BRIGHT = 0.74;
  const TILT = 0.22;                // 整体前倾
  const PIVOT_Y = 1.25;             // 倾斜支点

  const cosT = Math.cos(TILT);
  const sinT = Math.sin(TILT);

  const put = (x, y, z, c, size = 1) => {
    if (w >= count) return;
    const i = w * 3;
    const dy = y - PIVOT_Y;
    pos[i] = x;
    pos[i + 1] = dy * cosT - z * sinT + PIVOT_Y;
    pos[i + 2] = dy * sinT + z * cosT;
    col[i] = clamp01(c[0] * BRIGHT);
    col[i + 1] = clamp01(c[1] * BRIGHT);
    col[i + 2] = clamp01(c[2] * BRIGHT);
    siz[w] = size;
    w++;
  };

  /* ============================================================
     1. 紧簇立体玫瑰球（56%）
        中心 1 朵 + 中圈 5 朵 + 外低圈 6 朵，外圈下半部嵌入包装纸杯口
     ============================================================ */
  const N_ROSE = Math.floor(count * 0.56);

  const roses = [
    { x: DOME_C.x, y: DOME_C.y, z: DOME_C.z, R: 0.42, tilt: 0, dir: 0, wgt: 1.5 }
  ];
  // 中圈 5 朵
  for (let i = 0; i < 5; i++) {
    const a = (i / 5) * Math.PI * 2 + 0.30;
    roses.push({
      x: Math.cos(a) * 0.46,
      y: 1.74 + (i % 2) * 0.08,
      z: Math.sin(a) * 0.46,
      R: 0.36,
      tilt: 0.22,
      dir: a,
      wgt: 1.0
    });
  }
  // 外低圈 6 朵（贴住包装纸内缘）
  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * Math.PI * 2 + 0.85;
    roses.push({
      x: Math.cos(a) * 0.68,
      y: 1.48 + (i % 2) * 0.08,
      z: Math.sin(a) * 0.68,
      R: 0.33,
      tilt: 0.34,
      dir: a,
      wgt: 0.88
    });
  }

  const roseWSum = roses.reduce((s, r) => s + r.wgt, 0);

  const LAYERS = 5;
  const PETALS = [3, 5, 6, 7, 8];
  const layerW = PETALS.map((p, l) => p * (0.55 + 0.45 * l));
  const layerWSum = layerW.reduce((a, b) => a + b, 0);

  for (let ri = 0; ri < roses.length; ri++) {
    const rs = roses[ri];
    const n = Math.round(N_ROSE * rs.wgt / roseWSum);

    // 外倾旋转轴（垂直于径向）
    const ax = -Math.sin(rs.dir);
    const az = Math.cos(rs.dir);
    const ca = Math.cos(rs.tilt);
    const sa = Math.sin(rs.tilt);
    const kk = 1 - ca;

    for (let i = 0; i < n; i++) {
      let r = Math.random() * layerWSum;
      let l = 0;
      while (l < LAYERS - 1 && r > layerW[l]) { r -= layerW[l]; l++; }

      const P = PETALS[l];
      const pIdx = Math.floor(Math.random() * P);
      const u = Math.pow(Math.random(), 0.85);     // 0 花瓣根 → 1 花瓣尖
      const v = Math.random() * 2 - 1;

      /* —— 杯状螺旋花瓣：内层近竖直、外层外翻，纵向加深 —— */
      const rho0 = rs.R * (0.10 + 0.155 * l);
      const pLen = rs.R * (0.52 + 0.13 * l);
      const tiltL = 1.42 - 0.26 * l;               // 内层 81° → 外层 22°
      const halfW = 0.62 + 0.16 * l;
      const phi = (pIdx / P) * Math.PI * 2 + l * 0.85 + rs.dir +
                  v * halfW * (1 - 0.30 * u);

      const rho = rho0 + u * pLen * Math.cos(tiltL);
      // 纵向：花瓣抬升 × 1.32 做杯深，两侧 v² 上翘形成杯壁
      const ly = (u * pLen * Math.sin(tiltL)) * 1.32
               + (1 - u) * rs.R * 0.10
               + v * v * rs.R * (0.20 + 0.05 * l);
      const lx = Math.cos(phi) * rho;
      const lz = Math.sin(phi) * rho;

      /* —— Rodrigues 外倾 —— */
      const nd = ax * lx + az * lz;
      const nxp = -az * ly;
      const nyp = az * lx - ax * lz;
      const nzp = ax * ly;
      const rx = lx * ca + nxp * sa + ax * nd * kk;
      const ry = ly * ca + nyp * sa;
      const rz = lz * ca + nzp * sa + az * nd * kk;

      /* —— 色阶：深绯红花心 → 玫瑰粉 → 亮奶白花瓣边缘 —— */
      const tt = l / (LAYERS - 1);
      const base = mixC(C_DEEP, C_ROSE, Math.min(1, tt * 1.45));
      const edge = Math.pow(u, 1.4) * (0.20 + 0.80 * tt);
      const c = mixC(base, C_EDGE, Math.min(0.95, edge * 0.9));

      put(rs.x + rx, rs.y + ry, rs.z + rz, jitC(c, 0.02), 1.15);
    }
  }

  /* ============================================================
     2. 满天星（6%）+ 衬叶（4%）：都紧贴花球，不悬空
     ============================================================ */
  const N_STAR = Math.floor(count * 0.06);
  for (let i = 0; i < N_STAR; i++) {
    const a = Math.random() * Math.PI * 2;
    const rr = 0.25 + Math.random() * 0.55;              // r ∈ [0.25, 0.80]
    const y = 1.45 + Math.random() * 0.57;               // y ∈ [1.45, 2.02]
    put(
      Math.cos(a) * rr,
      y + (rr < 0.5 ? 0.12 : 0),                          // 内圈稍高，贴合穹顶
      Math.sin(a) * rr,
      mulC(C_STAR, rand(0.88, 1.0)),
      rand(0.9, 1.2)
    );
  }

  const N_LEAF = Math.floor(count * 0.04);
  const LEAVES = 7;
  for (let li = 0; li < LEAVES; li++) {
    const a = (li / LEAVES) * Math.PI * 2 + 0.45;
    const dx = Math.cos(a);
    const dz = Math.sin(a);
    // 叶根贴在外圈玫瑰与包装纸上沿的缝隙处
    const bx = dx * 0.62;
    const bz = dz * 0.62;
    const by = 1.38 + (li % 2) * 0.14;                   // y ∈ [1.38, 1.52]
    const len = 0.36;
    const wid = 0.115;
    const rise = 0.30;                                   // 斜向上探出
    const per = Math.floor(N_LEAF / LEAVES);
    for (let i = 0; i < per; i++) {
      const u = Math.random();
      const halfW = Math.pow(Math.sin(Math.PI * Math.pow(u, 0.82)), 0.85) * wid;
      const v = rand(-halfW, halfW);
      put(
        bx + dx * u * len - dz * v,
        by + u * rise + Math.abs(v) * 0.20,
        bz + dz * u * len + dx * v,
        mixC(C_LEAF_A, C_LEAF_B, Math.random()),
        1.1
      );
    }
  }

  /* ============================================================
     3. 包装纸（17% + 1.4% 边缘）：前低后高的斜杯口，无缝包住花球下半部
     ============================================================ */
  const N_PAPER = Math.floor(count * 0.17);
  for (let layer = 0; layer < 2; layer++) {
    const outer = layer === 0;
    const rTopBase = PAPER_TOP_R * (outer ? 1 : 0.86);
    const half = Math.floor(N_PAPER / 2);
    for (let i = 0; i < half; i++) {
      const t = Math.pow(Math.random(), 0.9);            // 0 收腰 → 1 上沿
      const a = Math.random() * Math.PI * 2;

      // 前低后高：sin(a) > 0 为镜头一侧
      const yTop = PAPER_TOP_MID - PAPER_TOP_TILT * Math.sin(a)
                 + (outer ? 0 : -0.08);                  // 内层略低
      const y = PAPER_BOT_Y + t * (yTop - PAPER_BOT_Y)
              + Math.sin(a * 6 + (outer ? 0 : 0.5)) * 0.035 * t * t * t;

      let r = PAPER_BOT_R + (rTopBase - PAPER_BOT_R) * Math.pow(t, 1.2);
      r *= 1 + Math.sin(a * 6 + (outer ? 0 : 0.5)) * 0.05 * t;

      put(Math.cos(a) * r, y, Math.sin(a) * r,
        mixC(C_PAPER_B, C_PAPER_A, t), outer ? 1.5 : 1.38);
    }
  }
  // 上沿加密：勾出优雅的暖金轮廓线
  const N_RIM = Math.floor(count * 0.014);
  for (let i = 0; i < N_RIM; i++) {
    const a = Math.random() * Math.PI * 2;
    const yTop = PAPER_TOP_MID - PAPER_TOP_TILT * Math.sin(a);
    const r = PAPER_TOP_R * (1 + 0.05 * Math.sin(a * 6));
    put(Math.cos(a) * r, yTop + Math.sin(a * 6) * 0.03, Math.sin(a) * r,
      mixC(C_PAPER_A, C_CHAMP, 0.6), 1.7);
  }

  /* ============================================================
     4. 收腰丝带环 + 立体蝴蝶结 + 两条飘带（7.5%）
        BOW_Y = 0.56，双耳 |x| ∈ [0.06, 0.34]，y ∈ [0.42, 0.72]
     ============================================================ */
  const N_RIB = Math.floor(count * 0.075);
  const bandN = Math.floor(N_RIB * 0.30);
  for (let i = 0; i < bandN; i++) {
    const a = Math.random() * Math.PI * 2;
    const r = 0.17 + 0.010 * Math.sin(a * 4);
    put(Math.cos(a) * r, BOW_Y + rand(-0.035, 0.035), Math.sin(a) * r,
      mixC(C_RIB_A, C_RIB_B, Math.random()), 1.25);
  }

  const earN = Math.floor((N_RIB - bandN) * 0.62);       // 双耳
  const tailN = N_RIB - bandN - earN;                    // 飘带
  for (let i = 0; i < earN; i++) {
    const side = i % 2 === 0 ? -1 : 1;
    const t = Math.random() * Math.PI * 2;
    // 椭环：|x| 0.06~0.34，y 0.42~0.72
    const lx = 0.20 + Math.cos(t) * 0.14;
    const ly = 0.57 + Math.sin(t) * 0.15;
    put(side * lx, ly, 0.20 + Math.sin(t) * 0.05,
      mixC(C_RIB_A, C_RIB_B, 0.25 + Math.random() * 0.5), 1.3);
  }
  for (let i = 0; i < tailN; i++) {
    const side = i % 2 === 0 ? -1 : 1;
    const t = Math.random();
    // 飘带：从结心（y≈0.52）自然下垂到 y = 0.12，微微外弯
    put(
      side * (0.055 + Math.sin(t * 2.0) * 0.085),
      BOW_Y - 0.04 - t * 0.40,
      0.205 + t * 0.05,
      mixC(C_RIB_B, C_RIB_A, Math.random() * 0.55),
      1.15
    );
  }

  /* ============================================================
     5. 花茎：收腰下方紧凑聚拢的一束（5%），y ∈ [0.05, 0.58]
     ============================================================ */
  const N_STEM = Math.floor(count * 0.05);
  const STEM_N = 6;
  for (let s = 0; s < STEM_N; s++) {
    const a = (s / STEM_N) * Math.PI * 2 + 0.3;
    const topR = 0.11;
    const botR = 0.06;
    const per = Math.floor(N_STEM / STEM_N);
    for (let i = 0; i < per; i++) {
      const t = Math.random();                            // 0 上 → 1 下
      const r = topR + (botR - topR) * t;
      put(
        Math.cos(a) * r + rand(-0.006, 0.006),
        STEM_TOP_Y - t * (STEM_TOP_Y - STEM_BOT_Y),
        Math.sin(a) * r + rand(-0.006, 0.006),
        mixC(C_STEM, HEX(0x6aa87f), Math.random() * 0.5),
        0.85
      );
    }
  }

  /* ============================================================
     6. 外围极少量漂浮星光（≤4%），远一点、暗一点，不干扰轮廓
     ============================================================ */
  let guard = 0;
  while (w < count && guard < count * 2) {
    guard++;
    const a = Math.random() * Math.PI * 2;
    const r = rand(1.15, 1.85);
    put(Math.cos(a) * r, rand(0.35, 2.35), Math.sin(a) * r,
      mulC(C_STAR, rand(0.18, 0.42)), rand(0.7, 1.0));
  }
  while (w < count) put(0, 1.2, 0, C_STAR, 0.6);

  return { pos, col, size: siz, filled: w };
}

/* ============================================================================
   4. 着色器
   ========================================================================== */
const CAKE_VERT = /* glsl */`
uniform float uTime;
uniform float uSpread;
uniform float uSize;
uniform float uPixelRatio;
uniform float uFlame;
uniform float uIgnite;
uniform float uBurst;
uniform float uSmoke;
uniform float uSmokeT;
uniform float uAir;      // 吹气强度：让火焰随气流摇曳
uniform float uBouquet;  // 0=蛋糕 1=花束

attribute vec3 aScatter;
attribute vec3 aColor;
attribute float aSize;
attribute float aSeed;
attribute float aFlame;
attribute vec3 aBouquet;        // 花束形态目标坐标
attribute vec3 aBouquetColor;   // 花束形态颜色
attribute float aBouquetSize;   // 花束形态下的尺寸倍率（花瓣 1.0 / 满天星小点 / 纸边更实）

varying vec3 vColor;
varying float vAlpha;
varying float vBouquet;

void main() {
  vec3 base = mix(position, aBouquet, uBouquet);
  vec3 pos = base;
  float s = uSpread;

  vec3 neb = aScatter;
  float ang = uTime * (0.10 + aSeed * 0.20) + s * (0.5 + aSeed);
  float ca = cos(ang);
  float sa = sin(ang);
  neb.xz = vec2(neb.x * ca - neb.z * sa, neb.x * sa + neb.z * ca);
  neb.y += sin(uTime * 0.7 + aSeed * 6.2831) * (0.12 + 0.38 * s);
  neb.x += cos(uTime * 0.5 + aSeed * 9.0) * 0.22 * s;

  pos = mix(base, neb, s);

  if (uBurst > 0.001) {
    pos.y += uBurst * (0.55 + aSeed * 2.0);
    pos.xz *= 1.0 + uBurst * (0.30 + aSeed * 0.75);
    pos.x += sin(uTime * 2.4 + aSeed * 31.0) * uBurst * 0.30;
    pos.z += cos(uTime * 2.1 + aSeed * 27.0) * uBurst * 0.30;
  }

  float kind = aFlame;
  float sizeMul = 1.0;
  float alpha = 1.0;
  vec3 col = mix(aColor, aBouquetColor, uBouquet);

  if (kind > 0.5 && kind < 1.5) {
    /* —— 火焰：基础抖动 + 被风吹偏 —— */
    pos.x += sin(uTime * 7.0 + aSeed * 41.0) * 0.020;
    pos.z += cos(uTime * 6.3 + aSeed * 33.0) * 0.020;
    pos.y += sin(uTime * 5.1 + aSeed * 27.0) * 0.022;

    // 吹气：火苗压短、向一侧倒伏并高频抖动
    float gust = uAir * (0.55 + 0.45 * sin(uTime * 22.0 + aSeed * 37.0));
    pos.x += gust * (0.10 + aSeed * 0.16);
    pos.z += gust * (0.04 + aSeed * 0.10);
    pos.y -= gust * 0.09;

    float flic  = 0.72 + 0.28 * sin(uTime * 9.0 + aSeed * 21.0);
    float flic2 = 0.86 + 0.14 * sin(uTime * 17.0 + aSeed * 8.0);
    col *= uFlame * flic * flic2 * 1.18 * (1.0 - uAir * 0.25);
    /* 变成花束时烛火柔和淡出 */
    alpha = 0.92 * uIgnite * (1.0 - uBouquet);
    sizeMul = (0.30 + 0.70 * uIgnite) * (1.0 - uAir * 0.3) * (1.0 - uBouquet * 0.6);
  } else if (kind > 1.5) {
    float life = fract(uSmokeT * 0.5 + aSeed * 0.5);
    pos.y += life * 1.35;
    pos.x += sin(life * 5.0 + aSeed * 23.0) * 0.26 * life;
    pos.z += cos(life * 4.4 + aSeed * 17.0) * 0.26 * life;
    alpha = (1.0 - life) * 0.46 * uSmoke;
    sizeMul = 0.7 + life * 2.0;
    col *= 0.6 + 0.4 * (1.0 - life);
  } else {
    pos += vec3(
      sin(uTime * 0.8 + aSeed * 12.0),
      cos(uTime * 0.7 + aSeed * 9.0),
      sin(uTime * 0.9 + aSeed * 15.0)
    ) * (0.012 * (1.0 - s));
    col *= 1.0 + uIgnite * 0.20;
  }

  col = mix(col, vec3(1.0, 0.84, 0.47), uBurst * (kind > 1.5 ? 0.18 : 0.48));
  col *= 1.0 + uBurst * 0.9;
  col *= 1.0 + s * 0.12;

  sizeMul *= 1.0 + uBurst * 0.55;
  /* 花束模式使用各自的尺寸倍率：满天星更小、包装纸边缘更实 */
  sizeMul *= mix(1.0, aBouquetSize, uBouquet);

  vec4 mv = modelViewMatrix * vec4(pos, 1.0);
  gl_Position = projectionMatrix * mv;

  float ps = aSize * uSize * uPixelRatio * (1.0 + s * 0.5) * sizeMul;
  gl_PointSize = clamp(ps * (10.0 / max(0.001, -mv.z)), 0.6, 40.0);

  alpha *= mix(1.0, 0.78, s);
  /* 花束模式整体降低单粒子权重：密集叠加时颜色才不会一起冲成白色 */
  alpha *= mix(1.0, 0.62, uBouquet);
  vColor = col;
  vAlpha = alpha;
  vBouquet = uBouquet;
}
`;

const FRAG = /* glsl */`
varying vec3 vColor;
varying float vAlpha;
varying float vBouquet;

void main() {
  vec2 uv = gl_PointCoord - 0.5;
  float d = length(uv);
  if (d > 0.5) discard;

  float soft = 1.0 - smoothstep(0.0, 0.5, d);
  float core = pow(soft, 2.6);
  /* 蛋糕：强核心增益（发光粒子感）；花束：压低核心增益，保住粉/金/绿的本来颜色 */
  float boost = mix(0.6 + 2.4 * core, 0.72 + 0.68 * core, vBouquet);
  vec3 col = vColor * boost;
  gl_FragColor = vec4(col, core * vAlpha);
}
`;

const cakeMat = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 },
    uSpread: { value: 0 },
    uSize: { value: 1 },
    uPixelRatio: { value: 1 },
    uFlame: { value: 1 },
    uIgnite: { value: 0 },
    uBurst: { value: 0 },
    uSmoke: { value: 0 },
    uSmokeT: { value: 0 },
    uAir: { value: 0 },
    uBouquet: { value: 0 }
  },
  vertexShader: CAKE_VERT,

});

const DUST_N = 5200;

for (let i = 0; i < DUST_N; i++) {
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(2 * Math.random() - 1);
  const R = 5.5 + Math.pow(Math.random(), 0.55) * 13;
  dpos.push(
    Math.sin(phi) * Math.cos(theta) * R,
    Math.cos(phi) * R * 0.75 + 1.4,
    Math.sin(phi) * Math.sin(theta) * R
  );
  const c = Math.random() < 0.62 ? PAL.dustA : PAL.dustB;
  const dim = rand(0.2, 0.62);
  dcol.push(c[0] * dim, c[1] * dim, c[2] * dim);
  dsize.push(rand(0.8, 2.6));
  dseed.push(Math.random());
}
const dustGeo = new THREE.BufferGeometry();
dustGeo.setAttribute('position', new THREE.Float32BufferAttribute(dpos, 3));
dustGeo.setAttribute('aColor', new THREE.Float32BufferAttribute(dcol, 3));
dustGeo.setAttribute('aSize', new THREE.Float32BufferAttribute(dsize, 1));
dustGeo.setAttribute('aSeed', new THREE.Float32BufferAttribute(dseed, 1));

const dustMat = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 },
    uSpread: { value: 0 },
    uSize: { value: 1 },
    uPixelRatio: { value: 1 },
    uWish: { value: 0 },
    uWishT: { value: 0 },
    uBurst: { value: 0 }
  },
  vertexShader: /* glsl */`
    uniform float uTime;
    uniform float uSpread;
    uniform float uSize;
    uniform float uPixelRatio;
    uniform float uWish;
    uniform float uWishT;
    uniform float uBurst;

    attribute vec3 aColor;
    attribute float aSize;
    attribute float aSeed;

    varying vec3 vColor;
    varying float vAlpha;
    varying float vBouquet;

    void main() {
      vec3 pos = position;
      pos.x += sin(uTime * 0.11 + aSeed * 11.0) * 0.75;
      pos.y += cos(uTime * 0.09 + aSeed * 7.0) * 0.65;
      pos.z += sin(uTime * 0.10 + aSeed * 5.0) * 0.75;
      pos *= 1.0 + uSpread * 0.12;

      if (uWish > 0.001) {
        float spin = uWish * (0.35 + aSeed * 1.15) * uWishT;
        float cw = cos(spin);
        float sw = sin(spin);
        pos.xz = vec2(pos.x * cw - pos.z * sw, pos.x * sw + pos.z * cw);
        pos.y += uWish * min(uWishT * 0.42, 2.8) * (0.35 + aSeed);
      }

      pos.y += uBurst * (1.2 + aSeed * 2.2);
      pos.xz *= 1.0 + uBurst * 0.35;

      vec4 mv = modelViewMatrix * vec4(pos, 1.0);
      gl_Position = projectionMatrix * mv;
      gl_PointSize = clamp(aSize * uSize * uPixelRatio * (4.0 / max(0.001, -mv.z)), 0.6, 6.0);

      float tw = 0.5 + 0.5 * sin(uTime * 1.7 + aSeed * 40.0);
      vColor = aColor * (1.0 + uWish * 0.45) * (1.0 + uBurst * 0.9);
      vColor = mix(vColor, vec3(1.0, 0.86, 0.58), uBurst * 0.55);
      vAlpha = (0.10 + 0.45 * tw) * (1.0 + uWish * 0.55);
      vBouquet = 0.0;   // 背景浮尘始终使用"蛋糕"的发光曲线
    }
  `,
  fragmentShader: FRAG,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending
});

const dustPoints = new THREE.Points(dustGeo, dustMat);

function makeGlowTexture() {
  const s = 128;
  const cv = document.createElement('canvas');
  cv.width = cv.height = s;
  const ctx = cv.getContext('2d');
  const g = ctx.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  g.addColorStop(0.00, 'rgba(255,240,200,1)');
  g.addColorStop(0.22, 'rgba(255,196,110,0.55)');
  g.addColorStop(0.55, 'rgba(255,140,60,0.13)');
  g.addColorStop(1.00, 'rgba(255,120,40,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, s, s);
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
const glowTex = makeGlowTexture();

const CARD_W = 512;
const CARD_H = 400;
const CARD_GEO = new THREE.PlaneGeometry(1.42, 1.11);

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/** 画一张「相纸」：奶油金相框 + 圆角照片 + 底部配文 */
function paintCard(cv, ctx, img, caption) {
  const W = CARD_W, H = CARD_H;
  ctx.clearRect(0, 0, W, H);

  // 相纸外框（暖金渐变）
  const frame = ctx.createLinearGradient(0, 0, W, H);
  frame.addColorStop(0, '#f7ead4');
  frame.addColorStop(0.52, '#e2c69b');
  frame.addColorStop(1, '#c3a071');
  roundRect(ctx, 3, 3, W - 6, H - 6, 30);
  ctx.fillStyle = frame;
  ctx.fill();

  // 相纸内缘的一圈高光
  roundRect(ctx, 3, 3, W - 6, H - 6, 30);
  ctx.strokeStyle = 'rgba(255,255,255,0.55)';
  ctx.lineWidth = 2;
  ctx.stroke();

  // 照片区域
  const px = 22, py = 22, pw = W - 44, ph = H - 44 - 62;
  ctx.save();
  roundRect(ctx, px, py, pw, ph, 16);
  ctx.clip();

  if (img) {
    const sr = img.width / img.height;
    const dr = pw / ph;
    let sw, sh, sx, sy;
    if (sr > dr) { sh = img.height; sw = sh * dr; sx = (img.width - sw) / 2; sy = 0; }
    else { sw = img.width; sh = sw / dr; sx = 0; sy = (img.height - sh) / 2; }
    ctx.drawImage(img, sx, sy, sw, sh, px, py, pw, ph);
  } else {
    const g = ctx.createRadialGradient(px + pw / 2, py + ph * 0.42, 10, px + pw / 2, py + ph * 0.42, pw * 0.72);
    g.addColorStop(0, '#ffcf8a');
    g.addColorStop(0.45, '#c9782f');
    g.addColorStop(1, '#4a2a12');
    ctx.fillStyle = g;
    ctx.fillRect(px, py, pw, ph);
    ctx.fillStyle = 'rgba(255,246,226,0.92)';
    ctx.font = '600 54px "PingFang SC","Microsoft YaHei",serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('✦', px + pw / 2, py + ph * 0.4);
    ctx.font = '500 22px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillStyle = 'rgba(255,246,226,0.65)';
    ctx.fillText('回忆加载中', px + pw / 2, py + ph * 0.66);
  }

  // 照片下沿压暗，让相纸过渡自然
  const shade = ctx.createLinearGradient(0, py + ph * 0.7, 0, py + ph);
  shade.addColorStop(0, 'rgba(0,0,0,0)');
  shade.addColorStop(1, 'rgba(0,0,0,0.28)');
  ctx.fillStyle = shade;
  ctx.fillRect(px, py + ph * 0.7, pw, ph * 0.3);
  ctx.restore();

  // 照片描边
  roundRect(ctx, px, py, pw, ph, 16);
  ctx.strokeStyle = 'rgba(90,62,32,0.35)';
  ctx.lineWidth = 2;
  ctx.stroke();

  // 底部配文（相纸上的深色字）
  const cap = (caption || '').slice(0, 16);
  if (cap) {
    ctx.fillStyle = 'rgba(74,52,28,0.88)';
    ctx.font = '600 26px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(cap, W / 2, H - 43);
  }
}

/** 悬停高亮用的描边贴图（所有卡片共用一张） */
function makeFrameGlowTexture() {
  const cv = document.createElement('canvas');
  cv.width = CARD_W;
  cv.height = CARD_H;
  const ctx = cv.getContext('2d');
  ctx.clearRect(0, 0, CARD_W, CARD_H);
  roundRect(ctx, 5, 5, CARD_W - 10, CARD_H - 10, 28);
  ctx.strokeStyle = 'rgba(255,235,200,1)';
  ctx.lineWidth = 7;
  ctx.shadowColor = 'rgba(255,200,120,1)';
  ctx.shadowBlur = 22;
  ctx.stroke();
  ctx.stroke();
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
const frameGlowTex = makeFrameGlowTexture();

function createPhotoCard(item, index) {
  const cv = document.createElement('canvas');
  cv.width = CARD_W;
  cv.height = CARD_H;
  const ctx = cv.getContext('2d');
  paintCard(cv, ctx, null, item.caption);

  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 4;

  const mat = new THREE.MeshBasicMaterial({
    map: tex, transparent: true, depthWrite: false,
    side: THREE.DoubleSide, toneMapped: false, opacity: 0
  });
  const mesh = new THREE.Mesh(CARD_GEO, mat);
  mesh.renderOrder = 3;

  // 背后柔光
  const haloMat = new THREE.MeshBasicMaterial({
    map: glowTex, color: 0xffb86a, transparent: true,
    blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0
  });
  const halo = new THREE.Mesh(new THREE.PlaneGeometry(2.7, 2.2), haloMat);
  halo.position.z = -0.02;
  mesh.add(halo);

  // 悬停高光边框
  const glowMat = new THREE.MeshBasicMaterial({
    map: frameGlowTex, transparent: true,
    blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0.1
  });
  const glow = new THREE.Mesh(CARD_GEO, glowMat);
  glow.position.z = 0.004;
  mesh.add(glow);

  const card = {
    index, item, canvas: cv, ctx, tex, mesh, mat, haloMat, glowMat,
    angle0: (index / MEMORY_PHOTOS.length) * Math.PI * 2,
    radius: 4.05 + (index % 2) * 0.35,
    y0: 1.15 + (index % 2 === 0 ? 0.42 : -0.30),
    speed: 0.30,
    appear: 0,
    hover: 0,
    appearAt: 0,
    imageOk: false
  };

  mesh.userData.card = card;
  photoGroup.add(mesh);
  return card;
}

function loadPhotoImage(card) {
  const url = (card.item.url || '').trim();
  if (!url) return;
  const img = new Image();
  img.crossOrigin = 'anonymous';
  let done = false;
  const finish = ok => {
    if (done) return;
    done = true;
    card.imageOk = !!(ok && img.naturalWidth);
    if (card.imageOk) {
      paintCard(card.canvas, card.ctx, img, card.item.caption);
      card.tex.needsUpdate = true;
    }
  };
  img.onload = () => finish(true);
  img.onerror = () => finish(false);
  setTimeout(() => finish(false), 8000);
  img.src = url;
}

MEMORY_PHOTOS.forEach((item, i) => {
  const card = createPhotoCard(item, i);
  photos.push(card);
  loadPhotoImage(card);
});
